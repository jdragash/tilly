<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tilly, combined</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
<!--
  Tilly, the combined prototype. 2026-10-17 to 2026-10-18.
  Questions it settled, one sidebar topic each, settled by Jake on 2026-10-18:
  Look: Drawn (symbols, I), the timeline as a Wallet stack, colour cards, a white sheet.
  Entry: the hand picks the category. Landing: Card leads, the card flips to its outline and, after a
  beat, drops into its row. Opening a bill: Flip back, and a charged card never flips.
  All bills: folders two across, neutral, cream cards, every bill shown, and a folder still opens.
  All bills runs in flow-bills.html beside it, which needs the folder served (python3 -m http.server).
  Briefs: docs/briefs/drawn-timeline/brief.md, and the motion and All bills briefs that follow.

  Retained as a record of the work rather than as a spec. Where this disagrees with the docs, the docs win.
-->
<style>
:root{
  --page:#E5E5EA; --sheet:#FFFFFF; --ground:#F2F2F7; --fg:#000000; --sec:#6C6C70; --hair:rgba(0,0,0,.14);
  --btn:#F2F2F7; --btnfg:#000; --off:#E5E5EA; --offfg:#AEAEB2; --accent:#2A78D6; --keyflash:#EEEEEE;
  --cardsh:0 12px 28px rgba(0,0,0,.16); --panel:#FFFFFF; --panelfg:#000; --ctl:#F2F2F7; --rowbar:#E3E3E8;
  --newdash:#AEAEB2; --newfg:#8E8E93;
}
html.dark{
  --page:#111113; --sheet:#1C1C1E; --ground:#000000; --fg:#FFFFFF; --sec:#98989F; --hair:rgba(255,255,255,.2);
  --btn:#2C2C2E; --btnfg:#fff; --off:#3A3A3C; --offfg:#6C6C70; --accent:#0A84FF; --keyflash:#3A3A3C;
  --cardsh:0 12px 28px rgba(0,0,0,.4); --panel:#1C1C1E; --panelfg:#fff; --ctl:#2C2C2E; --rowbar:#1C1C1E;
  --newdash:#636366; --newfg:#98989F; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--page);color:var(--fg);
  font:14px/1.3 -apple-system,system-ui,"SF Pro Text",Helvetica,Arial,sans-serif;touch-action:manipulation;
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none;user-select:none}
.noselect,.noselect *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* ---------- stage + phone ---------- */
/* in normal flow with a real height, so a host that sizes its frame to the page still shows it */
#stage{position:relative;height:100vh;height:100dvh;min-height:640px;display:flex;align-items:center;justify-content:center}
#phoneBox{position:relative;flex:none}
#phone{position:absolute;left:0;top:0;width:402px;height:874px;border-radius:55px;overflow:hidden;background:var(--ground);
  box-shadow:0 0 0 10px #111,0 30px 80px rgba(0,0,0,.3);transform-origin:0 0;
  --sat:47px;--sab:34px}
@media (min-width:900px){ #stage{margin-right:340px} }
@media (max-width:499px){
  #stage{display:block}
  #phoneBox{width:100%!important;height:100%!important}
  #phone{width:100%;height:100%;border-radius:0;box-shadow:none;transform:none!important;
    --sat:env(safe-area-inset-top,0px);--sab:calc(env(safe-area-inset-bottom,0px) + 8px)}
}
#ground{position:absolute;inset:0;padding:calc(var(--sat) + 8px) 16px 0}
#ground h1{font-size:34px;margin:8px 0 18px;font-weight:700;color:var(--sec);opacity:.5}
.grow{height:62px;border-radius:14px;background:var(--rowbar);margin-bottom:10px;opacity:.7}

/* ---------- sheet ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 10px);background:var(--sheet);
  border-radius:38px 38px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.12);will-change:transform}
.hbtn{position:absolute;top:16px;width:44px;height:44px;border-radius:50%;background:var(--btn);
  box-shadow:inset 0 0 0 .5px var(--hair);display:flex;align-items:center;justify-content:center;font-size:18px;
  color:var(--btnfg);z-index:6}
#xBtn{left:16px} #okBtn{right:16px;background:var(--off);color:var(--offfg)}
#okBtn.ok{background:var(--accent);color:#fff}
#okBtn svg{width:20px;height:20px}

/* ---------- card ---------- */
.card{position:absolute;left:22px;right:22px;top:76px;aspect-ratio:1.586;border-radius:20px;box-shadow:var(--cardsh);
  z-index:5;color:#fff;touch-action:manipulation;will-change:transform}
.face{position:absolute;inset:0;border-radius:20px}
#faceB{opacity:0}
.cin{position:absolute;inset:0;padding:16px 18px;border-radius:20px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.amt{flex:1;min-width:0;height:64px;display:flex;align-items:center;white-space:nowrap;cursor:pointer;text-align:left}
.amt #amtT{font-size:60px;font-weight:700;letter-spacing:-.026em;font-variant-numeric:tabular-nums;line-height:64px;
  font-family:-apple-system,system-ui,"SF Pro Display",Helvetica,Arial,sans-serif;display:inline-block}
.amt.faint #amtT{color:rgba(255,255,255,.58)}
.caret{display:none;width:2px;height:.82em;background:#fff;margin-left:2px;animation:blink 1.06s steps(1) infinite;
  flex:none}
.caret.on{display:inline-block}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
.dd{display:flex;flex-direction:column;gap:2px;align-items:flex-end;padding-top:2px}
.dl{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:13px;font-weight:600;line-height:16px;
  padding:14px 0;margin:-14px 0;color:#fff;position:relative}
.dl .t{position:relative;padding:3px;margin:-3px;display:inline-flex;align-items:center;gap:5px}
.dl .t::after,.tile::after{content:"";position:absolute;inset:0;border:2px solid #fff;border-radius:6px;opacity:0;transition:opacity .15s}
.dl.open .t::after{opacity:1}
.dl svg{width:10px;height:10px;color:rgba(255,255,255,.58);flex:none}
.nm{position:absolute;left:6px;bottom:10px;display:grid;padding:6px 12px;border-radius:9px;max-width:calc(100% - 66px);
  font-size:22px;line-height:26px;font-weight:600;cursor:text}
.nm .ghost{grid-area:1/1;visibility:hidden;white-space:pre;overflow:hidden}
.nm input{grid-area:1/1;width:0;min-width:100%;background:transparent;border:0;outline:0;padding:0;color:#fff;font:inherit;
  caret-color:#fff;-webkit-user-select:text;user-select:text}
.nm input::placeholder{color:rgba(255,255,255,.58);opacity:1}
.dash{position:absolute;inset:0;border:2px dashed rgba(255,255,255,.75);border-radius:9px;transition:opacity .15s;pointer-events:none}
.nm.has .dash{opacity:0}
.tile{position:absolute;right:18px;bottom:16px;width:46px;height:46px;border-radius:12.88px;display:flex;align-items:center;
  justify-content:center;color:#fff}
.tile .dash{border-radius:12.88px}
.tile.has .dash{opacity:0}
.tile::after{inset:-4px;border-radius:16px}
.tile.open::after{opacity:1}
.emo{font-size:28px;line-height:1;display:block}
.badge{position:absolute;right:-5px;bottom:-5px;width:16px;height:16px;border-radius:50%;background:#fff;color:#555;
  display:none;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tile.has .badge{display:flex}
.badge svg{width:9px;height:9px}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
.breathe .dash{animation:breathe 1.8s ease-in-out infinite}
.taps .dl,.taps .tile,.taps .nm,.taps .amt,.taps .key,.taps .hbtn{outline:1px solid magenta;outline-offset:-1px}

/* ---------- keypad ---------- */
#keypad{position:absolute;left:22px;right:22px;bottom:var(--sab);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;z-index:2}
#keypad.off{visibility:hidden;pointer-events:none}
.key{height:64px;border-radius:14px;font-size:26px;display:flex;align-items:center;justify-content:center;color:var(--fg);
  font-family:-apple-system,system-ui,sans-serif;position:relative}
.key.flash{background:var(--keyflash)}

/* ---------- pockets ---------- */
#pscroll{position:absolute;left:0;right:0;top:60px;bottom:0;overflow-y:auto;overflow-x:hidden;z-index:2;scrollbar-width:none;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#pscroll::-webkit-scrollbar{display:none}
#pscroll.off{visibility:hidden;pointer-events:none}
#grid{display:grid;grid-template-columns:repeat(3,108px);justify-content:center;column-gap:14px;row-gap:22px;
  padding-bottom:calc(50px + var(--sab))}
.pk{position:relative;width:108px;height:86px;transform-origin:50% 100%;touch-action:pan-y}
.pback{position:absolute;inset:0;border-radius:12px}
.pslip{position:absolute;left:10px;right:10px;height:34px;border-radius:6px;background:#fff;color:#3A3A3C;
  font-size:11px;font-weight:600;padding:2px 7px;box-shadow:0 -1px 3px rgba(0,0,0,.14);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:15px}
.pslot{position:absolute;left:0;top:0;width:108px;height:86px;z-index:5;pointer-events:none}
.plip{position:absolute;left:0;right:0;bottom:0;height:46px;border-radius:10px 10px 12px 12px;z-index:6;color:#fff;
  font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;
  box-shadow:0 -2px 6px rgba(0,0,0,.14);padding:0 6px;white-space:nowrap;overflow:hidden}
.plip span:last-child{overflow:hidden;text-overflow:ellipsis}
.pring{position:absolute;inset:-2.5px;border-radius:14px;border:2.5px solid var(--accent);z-index:7;opacity:0;
  transition:opacity .15s;pointer-events:none}
.pk.chosen .pring{opacity:1}
.pk.newpk{border:2px dashed var(--newdash);border-radius:12px}
.pk.newpk .nl{position:absolute;left:0;right:0;bottom:0;height:46px;display:flex;align-items:center;justify-content:center;
  color:var(--newfg);font-size:13px;font-weight:600}

/* ---------- overlays inside phone ---------- */
.pill{position:absolute;left:50%;transform:translateX(-50%);z-index:30;padding:9px 16px;border-radius:99px;font-size:13px;
  font-weight:600;white-space:nowrap}
#again{top:46%;background:var(--accent);color:#fff;display:none;font-size:15px;padding:12px 22px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
#haptic{bottom:calc(var(--sab) + 70px);background:rgba(30,30,30,.82);color:#fff;opacity:0;pointer-events:none}
#toast{bottom:calc(var(--sab) + 28px);background:rgba(30,30,30,.88);color:#fff;opacity:0;pointer-events:none;
  transition:opacity .2s}

/* ---------- controls ---------- */
#panel{display:none}
@media (min-width:900px){
  #panel{display:block;position:fixed;right:0;top:0;bottom:0;width:340px;overflow-y:auto;background:var(--panel);color:var(--panelfg);
    padding:16px 18px 40px;border-left:1px solid var(--hair);z-index:50}
  #tuneBtn,#drawer{display:none!important}
}
/* in the sheet header's empty middle, clear of the keypad */
#tuneBtn{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 32px);width:72px;height:32px;border-radius:16px;
  background:#111;color:#fff;font-weight:600;font-size:13px;z-index:90;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#drawer{position:fixed;left:0;right:0;bottom:0;max-height:70%;background:var(--panel);color:var(--panelfg);z-index:100;
  border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);overflow-y:auto;transform:translateY(105%);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
#drawer.open{transform:none}
#drawer .dh{position:sticky;top:0;background:var(--panel);display:flex;justify-content:space-between;align-items:center;
  padding:14px 0 8px;font-size:17px;font-weight:700;z-index:2}
#dclose{width:34px;height:34px;border-radius:50%;background:var(--ctl);font-size:15px}
.ctl h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);margin:18px 0 6px;font-weight:700}
.row{display:flex;align-items:center;gap:10px;min-height:32px;font-size:13px}
.row label{flex:1;min-width:0}
.row .v{width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--sec);font-size:12px}
.row input[type=range]{width:120px;flex:none;accent-color:var(--accent)}
.row select{font:inherit;font-size:13px;background:var(--ctl);color:inherit;border:0;border-radius:8px;padding:5px 8px}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.btns{display:flex;gap:8px;margin:10px 0}
.btns button{flex:1;background:var(--ctl);border-radius:10px;padding:9px;font-weight:600}
pre#swift{background:var(--ctl);border-radius:10px;padding:10px;font:11px/1.5 ui-monospace,Menlo,monospace;overflow-x:auto;
  white-space:pre;margin:6px 0;-webkit-user-select:text;user-select:text}
.step{margin:6px 0 10px}
.step .sl{font-size:13px;font-weight:600;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--ctl);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--panelfg);min-height:32px}
.chip.on{background:var(--accent);color:#fff}
.slots{display:flex;gap:10px}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.slot .load{width:52px}
.slot .load.empty{opacity:.4}
.slot .save{font-size:11px;color:var(--accent);font-weight:600;padding:2px 6px}
.desc{font-size:11.5px;line-height:1.35;color:var(--sec);margin:-2px 0 8px;max-width:280px}
.lies{font-size:12px;color:var(--sec);padding-left:16px;margin:6px 0}
.lies li{margin-bottom:4px}

/* ---------- the timeline behind the sheet ---------- */
:root{ --well:#E5E5EA; --glass:rgba(255,255,255,.72); --glassedge:rgba(0,0,0,.08); --raise:#FFFFFF; }
html.dark{ --well:#2C2C2E; --glass:rgba(58,58,60,.72); --glassedge:rgba(255,255,255,.12); --raise:#1C1C1E; }
#ground{display:none}
#sheet{z-index:10}
#topbar{position:absolute;left:0;right:0;top:0;height:calc(var(--sat) + 52px);padding:var(--sat) 16px 0;background:var(--ground);z-index:3;
  display:flex;align-items:center;justify-content:space-between}
.glass{height:40px;border-radius:20px;background:var(--glass);box-shadow:inset 0 0 0 .5px var(--glassedge),0 2px 10px rgba(0,0,0,.06);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:flex;align-items:center;font-size:17px;color:var(--fg)}
#backB{padding:0 14px 0 10px;gap:2px;font-weight:500}
#backB b{font-size:22px;font-weight:500;line-height:1;margin-top:-2px}
.gpair{display:flex}
.gpair button{width:44px;height:40px;display:flex;align-items:center;justify-content:center;font-size:22px}
.gpair svg{width:20px;height:20px}
#list{position:absolute;left:0;right:0;top:calc(var(--sat) + 52px);bottom:0;overflow-y:auto;overflow-x:hidden;z-index:1;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#list::-webkit-scrollbar{display:none}
.mh{position:sticky;top:0;background:var(--ground);padding:6px 20px 10px;z-index:2}
.mn{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:34px}
.mf{font-size:15px;color:var(--sec);height:20px;line-height:20px;position:relative;overflow:hidden}
.mf span{position:absolute;left:0;top:0;white-space:nowrap}
.r{position:relative;height:64px;overflow:visible}
.rin{position:absolute;inset:0;display:flex;align-items:center;gap:12px;padding:0 20px;border-radius:14px;transform-origin:50% 50%}
.wash{position:absolute;top:2px;bottom:2px;left:10px;right:10px;border-radius:14px;opacity:0;pointer-events:none}
.well{width:40px;height:40px;border-radius:10px;background:var(--well);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.rt{flex:1;min-width:0}
.rn{font-size:17px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd{font-size:13px;line-height:17px;color:var(--sec)}
.ra{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.past .rn,.past .ra{font-weight:400}
.past .ra{color:var(--sec)}
.endline{padding:18px 20px 120px;color:var(--sec);font-size:13px}
.slamming{background:var(--raise);box-shadow:0 14px 34px rgba(0,0,0,.22)}

/* ---------- things that fly, and pills ---------- */
#fly{position:absolute;z-index:25;pointer-events:none;display:none}
#fly .fs{position:absolute;inset:0;border-radius:6px;background:#fff;color:#3A3A3C;font-size:11px;font-weight:600;padding:2px 7px;
  line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 16px rgba(0,0,0,.22)}
#fly .fr{position:absolute;inset:0;border-radius:14px;background:var(--raise);box-shadow:0 10px 26px rgba(0,0,0,.2);overflow:hidden}
#fly .frin,.zrow{position:absolute;left:0;top:0;transform-origin:0 0}
.zrow{opacity:0;pointer-events:none}
#offpill{top:calc(var(--sat) + 120px);left:0;right:0;margin:0 auto;width:max-content;transform:none;background:var(--glass);color:var(--fg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:inset 0 0 0 .5px var(--glassedge),0 6px 20px rgba(0,0,0,.14);display:none;font-size:15px;padding:11px 18px;cursor:pointer;
  transform-origin:50% 50%}
#offpill i{font-style:normal;margin-left:6px}
#again{top:auto;bottom:calc(var(--sab) + 26px)}

/* ---------- controls additions ---------- */
.opts{display:flex;flex-direction:column;gap:6px;margin:4px 0 6px}
.opt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--ctl);border-radius:12px;padding:9px 12px}
.opt b{font-size:14px}
.opt span{font-size:11.5px;line-height:1.35;color:var(--sec);margin-top:2px}
.opt.on{background:var(--accent);color:#fff}
.opt.on span{color:rgba(255,255,255,.85)}
.ios{background:var(--ctl);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.45;margin:4px 0}
.ios p{margin:0 0 6px} .ios p:last-child{margin:0}
.ios code{font:11px ui-monospace,Menlo,monospace}
.feas{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 6px;margin-bottom:6px;color:#fff}
#replayB{width:100%;background:var(--accent);color:#fff;border-radius:10px;padding:10px;font-weight:600;margin:12px 0 2px}
.rin{transition:background-color .25s,box-shadow .25s}
.ohead{font-size:11px;font-weight:700;color:var(--sec);margin:6px 0 0 2px}
.view{position:absolute;left:0;right:0;top:calc(var(--sat) + 52px);bottom:0;overflow:hidden;z-index:1;background:var(--ground)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px;font-size:12px;color:var(--sec);text-align:center;margin-bottom:4px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px;row-gap:6px}
.mc{height:74px;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:.5px solid var(--hair);padding-top:4px}
.mc:not([data-d]){border-top-color:transparent}
.md{font-size:14px;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%}
.md.today{background:#FF3B30;color:#fff;font-weight:600}
.me{height:22px;font-size:17px;line-height:22px;display:flex;align-items:center}
.me span{display:inline-block;margin-left:-5px} .me span:first-child{margin-left:0}
.me small{font-size:10px;color:var(--sec);margin-left:1px}
.mt{font-size:11px;color:var(--sec);height:14px;line-height:14px;position:relative;overflow:hidden;min-width:44px;text-align:center}
.mt span{position:absolute;left:0;right:0;top:0}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;padding:4px 16px 0}
.ymn{font-size:15px;font-weight:600;color:#FF3B30;margin-bottom:4px}
.ym+.ym .ymn{color:var(--fg)}
.ydots{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.ydots i{position:relative;height:12px;display:flex;align-items:center;justify-content:center}
.ydots b{width:6px;height:6px;border-radius:50%;background:#AEAEB2;display:block}
.ydots b.ring{background:transparent;box-shadow:inset 0 0 0 1.5px #8E8E93;width:7px;height:7px}

const liftSpec=(to)=> S.liftEased?{to,ease:[S.liftDur,"inout"]}:{to,spring:[S.liftDur,S.liftB]};
const riseSpec=(to,from)=>{ const o=S.liftEased?{to,ease:[S.liftDur,"inout"]}:{to,spring:[S.liftDur,S.slipB]}; if(from!==undefined)o.from=from; return o; };
/* Chosen pocket: lifted 6px, ringed, a slip with the card's name stands in front (older slips shift up 11px). */
function setChosen(p,on,animate){

const ptx=new Tx(null);
let handles=[], inPocket=false, filingP=null, snap=null;
const later=(s,fn)=>{ const h=wait(s,fn); handles.push(h); return h; };
function sheetPos(p){ // pocket top-left in sheet coordinates, from layout (not affected by transforms)
  return { x:p.el.offsetLeft, y:pscroll.offsetTop+p.el.offsetTop-pscroll.scrollTop };
}
function ensureVisible(p){
  const top=pscroll.offsetTop+p.el.offsetTop-pscroll.scrollTop, min=card.offsetTop+card.offsetHeight+20, max=sheet.offsetHeight-86-24;
  if(top<min) pscroll.scrollTop-= (min-top); else if(top>max) pscroll.scrollTop+= (top-max);

function fileCard(){
  if(ui.busy||ui.closed||!complete()) return;
  ui.busy=true; nameIn.blur();

  ensureVisible(p);

  later(S.fileDelay+extra,()=>startFiling(p));
}
function startFiling(p){
  const W=card.offsetWidth, H=card.offsetHeight, bl=card.offsetLeft, bt=card.offsetTop;
  const cx0=bl+W/2, cy0=bt+H/2, pos=sheetPos(p), py=pos.y-6, px=pos.x;
  const lw=pks[0]?96:96, lh=lw/1.586, cxT=px+54, cyT=py+86-46-10+lh/2, sT=lw/W;
  inPocket=false;
  const pose=(cx,cy,s,r)=>{
    if(!inPocket) card.style.transform=`translate(${cx-W/2-bl}px,${cy-H/2-bt}px) rotate(${r}deg) scale(${s})`;
    else card.style.transform=`translate(${cx-px-W/2}px,${cy-py-H/2}px) rotate(${r}deg) scale(${s})`;
  };
  card.style.transition="none"; cardTx.el=null; card.style.pointerEvents="none";
  if(S.reduce){
    cardTx.el=card; cardTx.set("op",1); go(cardTx,"op",{to:0,fade:true},()=>land(p,true));
    return;
  }
  if(S.fileStyle==="drop"){
    if(p.preview) p.preview.tx.set("op",0); // the real slip arrives at landing
    ptx.on=(prop,v)=>{
      if(prop!=="p") return;
      const ex=CURVES.dropX(v), ey=CURVES.dropY(v);
      if(!inPocket&&v>=.7){ inPocket=true; p.el.style.zIndex=20; card.style.width=W+"px"; card.style.right="auto"; card.style.left="0"; card.style.top="0"; p.slot.appendChild(card); card.style.transformOrigin="50% 50%"; card.style.zIndex="auto"; }
      if(!inPocket) p.el.style.zIndex=20;
      pose(cx0+(cxT-cx0)*ex, cy0+(cyT-cy0)*ey, 1+(sT-1)*ex, S.fileTurn*ex);
    };
    ptx.set("p",0);

    go(ptx,"p",{from:0,to:1,ease:[S.fileDur,"linear"]},()=>land(p,false));
  } else {
    ptx.on=(prop,v)=>{ if(prop==="p") pose(cx0+(cxT-cx0)*v, cy0+(cyT-cy0)*v, 1+(sT-1)*v, 0); };
    ptx.set("p",0);
    go(ptx,"p",{from:0,to:1,ease:[S.fileDur,"shrink"]},()=>land(p,false));
  }
}
function commitItem(){
  if(ui.committed) return; ui.committed=true;

}
function land(p,reduced){
  ptx.on=null; card.style.visibility="hidden"; // the card disappears
  commitItem(); haptic("medium");
  if(!reduced){
    if(S.fileStyle==="drop"){
      // new slip pops up, settles; the pocket squashes from its base and springs back
      if(p.preview){
        const s=p.preview.tx; s.set("op",1); s.set("y",0);
        go(s,"y",{to:-S.slipPop,ease:[.14,"out"]},()=>go(s,"y",{to:0,spring:[S.slipDur,S.slipSB]}));
      }
      const sxT=1+(1-S.sqY)*.58;
      go(p.tx,"sy",{to:S.sqY,ease:[.07,"out"]},()=>go(p.tx,"sy",{to:1,spring:[S.sqDur,S.sqB]}));

const nbTx=new WeakMap(); const txOf=el=>{ let t=nbTx.get(el); if(!t){ t=new Tx(el); nbTx.set(el,t); } return t; };
const scTx=new Tx(null,{v:0}); scTx.on=(p,v)=>{ if(p==="v") list.scrollTop=v; };
const listTx=new Tx(list), pillTx=new Tx(offpill), flyTx=new Tx(null,{p:0}), zTx=new Tx(null,{p:0}), hTx=new Tx(null,{h:64});
hTx.on=(p,v)=>{ if(p==="h"&&L) L.el.style.height=Math.max(0,v)+"px"; };

function sheetOff(){ return sheet.offsetHeight+30; }
function closeSheet(){
  if(ui.closing||ui.closed) return;
  ui.closing=true;
  if(S.reduce) go(sheetTx,"op",{to:0,fade:true},()=>{ sheetTx.set("y",sheetOff()); sheetTx.set("op",1); ui.closed=true; });
  else if(S.sheetExit==="soft"){
    // its contents go first, so what drops is a plain sheet, and it drops a little slower
    [...sheet.children].forEach(c=>{ if(c!==card){ c.style.transition="opacity .14s ease-out"; c.style.opacity=0; } });
    go(sheetTx,"y",{to:sheetOff(),spring:[S.sheetDur+.2,0]},()=>{ ui.closed=true; });
  }
  else go(sheetTx,"y",{to:sheetOff(),spring:[S.sheetDur,0]},()=>{ ui.closed=true; });
}
const scrimEl=$("scrim");
(function dim(){ const off=sheetOff(), k=off>0?clamp01(1-sheetTx.y/off):0;
  const kk=Math.max(S.sheetExit==="soft"?k*sheetTx.op:0,window.__billsK||0);
  scrimEl.style.opacity=(.16*kk).toFixed(3); requestAnimationFrame(dim); })();
function resetSheetGeom(){
  ["left","top","width","height","right","bottom","borderRadius","boxShadow"].forEach(k=>sheet.style[k]="");
  [...sheet.children].forEach(c=>{ c.style.transition=""; c.style.opacity=""; });
  sheet.querySelectorAll(".zrow").forEach(z=>z.remove());
}

function beginDrop(fast){
  if(phase!=="filing") return;
  phase="landing";
  const ld=LANDS[S.lands], primKey=mkey(ld.y,ld.m), prim=months.get(primKey);
  const it={name:bill.name.trim()||"Bill",emoji:cats[bill.cat].emoji,amt:parseFloat(bill.amount)||0,day:ld.d,
    isNew:true,extra:!ld.monthly,cat:bill.cat,start:ld.monthly};
  const o=S.reduce?"fade":S.opt;
  snap0=takeSnap();
  anchored(()=>{
    // the bill's later charges, all off screen above, go in at once
    if(ld.monthly) months.forEach((mo,k)=>{ if(k>primKey){ insertItem(mo,Object.assign({},it,{start:false})); setFig(mo); } });
    insertItem(prim,it);
  });
  added={ld,it};
  const el=it.el, rin=el.querySelector(".rin"), wash=el.querySelector(".wash");
  L={mo:prim,it,el,rin,wash,rinTx:new Tx(rin),washTx:new Tx(wash,{op:0}),off:false,viaPill:false};
  const h0 = (o==="slide") || (o==="fall") || (o==="card") || (o==="slip"&&S.flyGap==="arrival");
  if(h0) el.style.height="0px";
  if(o!=="highlight") L.rinTx.set("op",0);
  L.off=!inView(el);
  if(L.off&&(S.offMode==="jump"||o==="zoom"||o==="carry"||o==="card")){ list.scrollTop=targetFor(el); L.off=false; } // behind the sheet
  if(fast){ closeSheet(); finishLanding(); return; }
  if(S.view!=="days"){
    if(S.view==="month") renderMonth({hideNew:true,fig:snap0.month}); else renderYear({hideNew:true,totals:snap0.totals,sum:snap0.sum});
    closeSheet(); lat(.12,S.view==="month"?playMonth:playYear); return;
  }
  if(o==="zoom") zoomSheet();
  else if(o==="carry") startCarry();
  else if(o==="card") startCard();
  else if(o==="slip") startFly();
  else { closeSheet(); lat(S.overlap==="with"?.12:.38,arrive); }
}
function arrive(){
  if(!L.off) return play();
  if(S.offMode==="scroll") scrollToRow(play); else showPill();
}
function scrollToRow(done){
  const to=targetFor(L.el);
  if(S.reduce){ list.scrollTop=to; done&&done(); return; }
  scTx.set("v",list.scrollTop);
  go(scTx,"v",{to,spring:[.6,0]},()=>{ L.off=false; done&&done(); });
}
function endSoon(t){ lat(t,()=>{ phase="done"; showAgain(); }); }
function showAgain(){ againP.style.display="block"; }

function play(){
  L.off=false; rollFig(L.mo);
  const o=S.reduce?"fade":(L.viaPill&&["slip","zoom","carry","card"].includes(S.opt))?"reveal":S.opt;
  if(o==="fade"||o==="reveal"){ L.el.style.height=""; go(L.rinTx,"op",{to:1,ease:[.2,"out"],fade:true}); washOn(.2); endSoon(1.2); return; }
  if(o==="highlight") return playHL();
  if(o==="slam") return playSlam();
  if(o==="slide") return playSlide();
  if(o==="fall") return playFall();
}
function washOn(delay){
  const c=S.hlTint==="cat"?hex2rgb(catHex(L.it.cat!=null?L.it.cat:bill.cat)):null;
  L.wash.style.background=c?`rgba(${c},${S.dark?.32:.22})`:"var(--well)";
  const fade=S.reduce?.6:S.hlFade;
  L.washTx.set("op",0);
  go(L.washTx,"op",{to:1,ease:[.15,"out"],fade:true},()=>lat((delay||0)+.25,()=>go(L.washTx,"op",{to:0,ease:[fade,"inout"],fade:true})));
}

/* ---------- 1 · Highlight: it's there when the sheet uncovers it, washed in the folder's colour ---------- */
function playHL(){
  washOn(0);
  if(S.hlPulse) go(L.rinTx,"s",{to:1.035,ease:[.12,"out"]},()=>go(L.rinTx,"s",{to:1,spring:[.4,.5]}));
  endSoon(S.hlFade+.4);
}

/* ---------- 2 · Slam: it drops from above the page into its gap, and the rows around it ripple ---------- */
function playSlam(){
  const r=L.rinTx; L.it.cat=bill.cat;
  L.rin.classList.add("slamming");
  r.set("s",S.slamFrom); r.set("op",0);
  go(r,"op",{to:1,ease:[.08,"out"]});
  go(r,"s",{to:1,ease:[.17,"in"]},()=>{
    haptic("heavy");
    L.rin.classList.remove("slamming");
    go(r,"sy",{to:.93,ease:[.05,"out"]},()=>go(r,"sy",{to:1,spring:[.35,.5]}));
    go(r,"sx",{to:1.025,ease:[.05,"out"]},()=>go(r,"sx",{to:1,spring:[.35,.5]}));
    ripple(); if(S.shake) shake(); if(S.glow) washOn(0);
    endSoon(S.glow?S.hlFade+.4:.9);
  });
}
function ripple(){
  if(S.ripple==="off") return;
  const rows=[...list.querySelectorAll(".r")], i0=rows.indexOf(L.el);
  rows.forEach((row,i)=>{
    const d=Math.abs(i-i0); if(!d||d>S.reach) return;
    const k=Math.pow(.72,d-1), dir=i<i0?-1:1, tx=txOf(row);
    lat((d-1)*.035,()=>{
      if(S.ripple==="push") go(tx,"y",{to:dir*S.strength*k,ease:[.07,"out"]},()=>go(tx,"y",{to:0,spring:[.45,.5]}));
      else go(tx,"s",{to:1+S.strength*.006*k,ease:[.08,"out"]},()=>go(tx,"s",{to:1,spring:[.4,.4]}));
    });
  });
}
function shake(){
  const seq=[5,-4,2.5,-1,0]; let i=0;
  const step=()=>{ if(i>=seq.length) return; go(listTx,"x",{to:seq[i++],ease:[.045,"inout"]},step); };
  step();
}

/* ---------- 3 · Slide in: the gap opens and the row slides into it ---------- */
function playSlide(){
  const r=L.rinTx, W=L.el.offsetWidth, sp={spring:[S.slideDur,S.slideB]};
  L.it.cat=bill.cat;
  const slide=()=>{
    if(S.slideFrom==="below"){ r.set("y",24); r.set("op",0); go(r,"y",Object.assign({to:0},sp),()=>haptic("light")); go(r,"op",{to:1,ease:[.2,"out"]}); }
    else { r.set("x",S.slideFrom==="right"?W:-W); r.set("op",1); go(r,"x",Object.assign({to:0},sp),()=>haptic("light")); }
    if(S.glow) lat(S.slideDur*.6,()=>washOn(0));
    endSoon(S.slideDur+(S.glow?S.hlFade+.2:.5));
  };
  hTx.set("h",0);
  go(hTx,"h",{to:64,spring:[.4,0]},()=>{ L.el.style.height=""; });
  if(S.slideGap==="before") lat(.2,slide); else slide();
}

/* ---------- 4 · Slip flies: the bill's slip comes out of the folder and becomes the row ---------- */
function setFlyRect(b,rad){ fly.style.left=b.x+"px"; fly.style.top=b.y+"px"; fly.style.width=b.w+"px"; fly.style.height=b.h+"px";
  fly.querySelector(".fr").style.borderRadius=rad+"px"; }
function startFly(){
  L.it.cat=bill.cat;
  const p=pks[bill.cat], slip=p&&p.preview?p.preview.el:null;
  const A=slip?relRect(slip):{x:157,y:520,w:88,h:34};
  if(slip) slip.style.visibility="hidden";
  const fs=fly.querySelector(".fs"), fr=fly.querySelector(".fr"), frin=fly.querySelector(".frin");
  fs.textContent=L.it.name;
  frin.innerHTML=`<div class="rin" style="position:absolute;inset:0">${rowInner(L.it.emoji,L.it.name,dayLabel(L.mo,L.it.day),money(L.it.amt))}</div>`;
  fs.style.opacity=1; fr.style.opacity=0; fly.style.opacity=1; fly.style.display="block";
  // lift it clear of the folder as the sheet starts down
  const A2={x:A.x-6,y:A.y-16,w:A.w+12,h:A.h+4};
  flyTx.on=(pr,v)=>{ if(pr==="p") setFlyRect({x:lerp(A.x,A2.x,v),y:lerp(A.y,A2.y,v),w:lerp(A.w,A2.w,v),h:lerp(A.h,A2.h,v)},6); };
  flyTx.set("p",0); go(flyTx,"p",{to:1,ease:[.16,"out"]});
  closeSheet();
  lat(.2,()=>{
    if(!L.off) return flyTo(A2,()=>rowRect(L.el),true);
    if(S.offMode==="scroll") return scrollToRow(()=>flyTo(A2,()=>rowRect(L.el),true));
    // off screen with a pill: the slip becomes the pill
    offpill.style.visibility="hidden"; showPill(true);
    flyTo(A2,()=>relRect(offpill),false);
  });
}
function flyTo(A,targetFn,toRow){
  const B=targetFn(), fs=fly.querySelector(".fs"), fr=fly.querySelector(".fr"), frin=fly.querySelector(".frin");
  frin.style.width=B.w+"px"; frin.style.height=B.h+"px";
  if(!toRow){ frin.style.display="none"; }
  else frin.style.display="";
  const ax=A.x+A.w/2, ay=A.y+A.h/2, bx=B.x+B.w/2, by=B.y+B.h/2, dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy)||1;
  const arc=S.flyPath==="arc"?Math.min(110,len*.28):0, px=-dy/len, py=dx/len;
  let opened=false, landed=false;
  flyTx.on=(pr,v)=>{
    if(pr!=="p") return;
    const t=v, bump=arc*Math.sin(Math.PI*clamp01(t));
    const b={x:lerp(A.x,B.x,t)+px*bump, y:lerp(A.y,B.y,t)+py*bump, w:Math.max(20,lerp(A.w,B.w,t)), h:Math.max(10,lerp(A.h,B.h,t))};
    setFlyRect(b,lerp(6,toRow?14:22,clamp01(t)));
    fs.style.opacity=1-clamp01((t-.12)/.35);
    fr.style.opacity=toRow?clamp01((t-.08)/.35):clamp01((t-.2)/.4);
    if(toRow){ const s=b.w/B.w; frin.style.transform=`translate(0px,${(b.h-B.h*s)/2}px) scale(${s})`; }
    if(toRow&&S.flyGap==="arrival"&&!opened&&t>.45){ opened=true; hTx.set("h",0); go(hTx,"h",{to:64,spring:[.35,0]},()=>{ L.el.style.height=""; }); }
    if(!landed&&t>.97){ landed=true; haptic("light"); }
  };
  flyTx.set("p",0);
  go(flyTx,"p",{to:1,spring:[S.flyDur,S.flyB]},()=>{
    flyTx.on=null;
    if(toRow){
      L.el.style.height=""; L.rinTx.set("op",1); rollFig(L.mo);
      go(new Tx(fly),"op",{from:1,to:0,ease:[.12,"out"]},()=>{ fly.style.display="none"; fly.style.opacity=1; fly.style.transform=""; });
      if(S.glow) washOn(0);
      endSoon(S.glow?S.hlFade+.4:.4);
    } else {
      fly.style.display="none"; offpill.style.visibility="";
      go(pillTx,"s",{from:.9,to:1,spring:[.35,.5]});
    }
  });
}

/* ---------- 5 · Zoom in: the sheet doesn't drop, it shrinks into the new row ---------- */
function zoomSheet(){
  L.it.cat=bill.cat;
  const A=relRect(sheet), B=rowRect(L.el);
  [...sheet.children].forEach(c=>{ c.style.transition="opacity .12s"; c.style.opacity=0; });
  const z=document.createElement("div"); z.className="zrow";
  z.innerHTML=`<div class="rin" style="position:absolute;inset:0">${rowInner(L.it.emoji,L.it.name,dayLabel(L.mo,L.it.day),money(L.it.amt))}</div>`;
  z.style.width=B.w+"px"; z.style.height=B.h+"px"; sheet.appendChild(z);
  sheet.style.right="auto"; sheet.style.bottom="auto";
  zTx.on=(pr,v)=>{
    if(pr!=="p") return;
    const b={x:lerp(A.x,B.x,v),y:lerp(A.y,B.y,v),w:Math.max(40,lerp(A.w,B.w,v)),h:Math.max(30,lerp(A.h,B.h,v))};
    sheet.style.left=b.x+"px"; sheet.style.top=b.y+"px"; sheet.style.width=b.w+"px"; sheet.style.height=b.h+"px";
    sheet.style.borderRadius=lerp(38,14,clamp01(v))+"px";
    const s=b.w/B.w; z.style.transform=`translate(0px,${(b.h-B.h*s)/2}px) scale(${s})`; z.style.opacity=clamp01((v-.3)/.4);
  };
  zTx.set("p",0);
  go(zTx,"p",{to:1,spring:[S.zoomDur,S.zoomB]},()=>{
    zTx.on=null; haptic("light"); L.rinTx.set("op",1); rollFig(L.mo);

    if(S.glow) washOn(0);
    endSoon(S.glow?S.hlFade+.4:.5);
  });
}

  offpill.innerHTML=`Added to ${mname(L.mo)}<i>${up?"↑":"↓"}</i>`;
  offpill.style.display="block"; phase="pill";

}

/* ---------- the month's figure rolls, as .contentTransition(.numericText()) does ---------- */
function rollFig(mo){
  const now=figOf(mo), old=mo.figEl.querySelector("span");
  if(!old||old.textContent===now) return;
  if(S.figure==="jump"||S.reduce){ setFig(mo); return; }
  const down=document.createElement("span"); down.textContent=now; mo.figEl.appendChild(down);
  const ot=new Tx(old), nt=new Tx(down,{y:18,op:0});
  go(ot,"y",{to:-18,spring:[.35,0]}); go(ot,"op",{to:0,ease:[.15,"out"]},()=>old.remove());
  go(nt,"y",{to:0,spring:[.35,.15]}); go(nt,"op",{to:1,ease:[.2,"out"]});
}

/* ---------- a tap during any of it ends it at once ---------- */
function finishLanding(){
  lh.forEach(h=>h.cancel()); lh.length=0;
  [scTx,listTx,flyTx,zTx,hTx,pillTx].forEach(t=>E.cancel(t));
  flyTx.on=null; zTx.on=null; sheetTx.on=null; listTx.set("x",0); pillTx.set("s",1);
  fly.style.display="none"; fly.querySelector(".fs").style.display=""; offpill.style.visibility="";
  E.cancel(sheetTx); resetSheetGeom(); sheetTx.set("op",1); sheetTx.set("y",sheetOff()); ui.closed=true;
  list.querySelectorAll(".r").forEach(r=>{ const t=nbTx.get(r); if(t){ E.cancel(t); t.set("x",0); t.set("y",0); t.set("s",1); } });
  if(L){
    E.cancel(L.rinTx); E.cancel(L.washTx);
    L.el.style.height=""; ["x","y"].forEach(k=>L.rinTx.set(k,0)); ["s","sx","sy","op"].forEach(k=>L.rinTx.set(k,1));
    L.rin.classList.remove("slamming"); L.washTx.set("op",0); setFig(L.mo);
    if(S.view!=="days"){
      const ld=LANDS[S.lands];
      if(S.view==="year") renderYear();
      else if(monthShown.y===ld.y&&monthShown.m===ld.m||phase==="pill") renderMonth();
      else { renderMonth(); offpill.innerHTML=`Added to ${mname({y:ld.y,m:ld.m})}<i>›</i>`; offpill.style.display="block"; phase="pill"; return; }
      phase="done"; showAgain(); return;
    }
    if(L.off&&S.offMode==="pill"){ showPill(true); return; }
    if(L.off) list.scrollTop=targetFor(L.el);
    L.off=false;
  }
  phase="done"; showAgain();
}

/* =====================================================================================================
   THE HAND — categories as cards you play onto the bill, not folders it goes into
   (from docs/prototypes/edit-revisit-card.html's P2: the fan, the flight to the tile, the flood and the stamp)
   ===================================================================================================== */
const handEl=$("hand");
const HW=84, HH=120, DEAL=200;
let handActive=-1;
function fanStep(n,W){ return Math.min(48,(W-HW-64)/Math.max(1,n-1)); }
function fanPose(i,n,W,o){
  const step=fanStep(n,W), a=8, rad=Math.PI/180, xc=(i-(n-1)/2)*step, th=xc/step*a;
  const R=step/Math.sin(a*rad), x=R*Math.sin(th*rad), y=R*(1-Math.cos(th*rad));
  return `translate(${(x+(o.dx||0)).toFixed(1)}px,${(y+(o.dy||0)+(o.lift||0)).toFixed(1)}px) rotate(${(th+(o.rot||0)).toFixed(2)}deg) scale(${o.scale||1})`;
}
function buildHand(){
  handEl.innerHTML="";
  cats.slice(0,S.pockets).forEach((c,i)=>{
    const el=document.createElement("div"); el.className="hc"; el.dataset.i=i; el.style.setProperty("--c",catHex(i));
    el.innerHTML=drawn()?`<span class="hbig hpic">${catPic(i,44,false)}</span><span class="hname">${c.name}</span>`:`<span class="hpip">${c.emoji}</span><span class="hbig">${c.emoji}</span><span class="hname">${c.name}</span>`;
    handEl.appendChild(el);
  });
  const nw=document.createElement("div"); nw.className="hc hnew"; nw.dataset.i="new";
  nw.innerHTML=`<span class="hbig">+</span><span class="hname">New</span>`; handEl.appendChild(nw);
}
const handCards=()=>[...handEl.querySelectorAll(".hc")].filter(c=>!c.classList.contains("played"));
function layoutHand(deal){
  const cards=handCards(), n=cards.length, W=handEl.clientWidth||402;
  handEl.querySelectorAll(".hc.played").forEach(c=>{ c.style.transition="none"; c.style.opacity=0; });
  cards.forEach((c,i)=>{

   Its controls live in this sidebar under All bills, as ab_ keys; tapping a card there opens it here, in the editor.
   ===================================================================================================== */
const billsF=$("billsF");
let AB=null, billsFrom=null; // billsFrom: the All bills card the open editor came from
const billsTx=new Tx(null,{y:900});
billsTx.on=(p,v)=>{ if(p==="y"){ billsF.style.transform=`translateY(${v}px)`; window.__billsK=clamp01(1-v/billsH()); } };
const billsH=()=>phone.offsetHeight+20;
const REPW={m:"Monthly",q:"Every 3 months",y:"Yearly"};
const abVals=vals=>{ const o={}; Object.keys(vals).forEach(k=>o[k.slice(3)]=vals[k]); return o; };
function pushBills(keys){
  if(!AB) return; const o={};
  (keys||topicKeys.bills||[]).forEach(k=>{ if(k.startsWith("ab_")) o[k.slice(3)]=S[k]; });
  o.dark=!!S.dark; o.look=S.skin==="drawn"?"drawn":"ios"; o.drawDir=S.drawDir; o.reduce=!!S.reduce; o.slow=S.slow;
  AB.set(o);
}
window.__flowBills={
  ready(ab){
    AB=ab;
    const keys=ab.SKEYS.filter(k=>k!=="look"&&k!=="reduce"&&k!=="drawDir").map(k=>"ab_"+k);
    topicKeys.bills=keys; keys.forEach(k=>{ if(!LKEYS.includes(k)) LKEYS.push(k); });
    let saved={}; try{ saved=JSON.parse(localStorage.getItem("tilly-card-landing")||"{}")||{}; }catch(e){}
    keys.forEach(k=>{ S[k]=k in saved?saved[k]:ab.S[k.slice(3)]; });
    buildBillsTopic(ab);
    const cs=getComputedStyle(phone); ab.insets(parseFloat(cs.getPropertyValue("--sat"))||47,parseFloat(cs.getPropertyValue("--sab"))||34);
    pushBills(); syncControls();
  },
  open(b){ openFromBills(b); },
  close(){ closeBills(); },
};
function openBills(){
  if(!AB||(phase!=="done"&&phase!=="pill")) return;
  againP.style.display="none"; offpill.style.display="none";
  phase="bills"; billsF.style.visibility="visible"; pushBills();
  if(S.reduce){ billsTx.set("y",0); billsF.style.opacity=0; go(new Tx(billsF,{op:0}),"op",{to:1,fade:true}); return; }
  billsF.style.opacity=1; billsTx.set("y",billsH()); go(billsTx,"y",{to:0,spring:[.45,.15]});
}
function closeBills(then){
  if(AB&&AB.openF) AB.closeFolder();
  go(billsTx,"y",{to:billsH(),spring:[.4,0]},()=>{ billsF.style.visibility="hidden"; if(then) then(); });
  if(!then){ phase="done"; showAgain(); }
}
$("listB").addEventListener("click",e=>{ e.stopPropagation(); if(phase==="bills") closeBills(); else openBills(); });

/* a card in All bills opens in the editor: it lifts out of its folder and flies to the editor card's place while
   All bills goes down and the editor comes up behind it */
function openFromBills(b){
  if(phase!=="bills") return;
  const r=b.el.getBoundingClientRect(); // the frame isn't scaled, so its coordinates are the phone's
  const R={x:r.left,y:r.top+billsTx.y,w:r.width,h:r.height};
  restoreCard(); resetBill(true);
  bill.amount=(+b.amt).toFixed(2); bill.name=b.name; bill.cat=catOfEmoji(b.f.emoji); bill.date=b.next; bill.repeat=REPW[b.rep]||"Monthly";
  ui.committed=true; paintFaces(); setPanelRaw("keypad"); renderCard();
  E.cancel(sheetTx); resetSheetGeom(); okTx.set("s",1); ui.closed=false; ui.closing=false;
  billsFrom=b; O=null; phase="opening";
  if(S.reduce){ closeBills(()=>{}); sheetTx.set("y",0); sheetTx.set("op",0); go(sheetTx,"op",{to:1,fade:true},()=>{ phase="edit"; }); return; }
  sheetTx.set("y",0); const A=relRect(card); sheetTx.set("op",1); sheetTx.set("y",sheetOff());
  b.el.style.visibility="hidden";
  const fs=fly.querySelector(".fs"), fr=fly.querySelector(".fr"), frin=fly.querySelector(".frin");
  fs.style.display="none"; fr.style.opacity=0; frin.style.display="none"; fly.style.opacity=1; fly.style.display="block";
  card.style.cssText=`position:absolute;left:0;top:0;right:auto;width:${A.w}px;height:${A.h}px;transform-origin:0 0;z-index:1`;
  cardTx.el=null; fly.appendChild(card);
  haptic("light");
  closeBills(()=>{});
  go(sheetTx,"y",{to:0,spring:[S.openDur+.05,.1]});
  opTx.on=(pr,t)=>{ if(pr!=="p") return;
    const q={x:lerp(R.x,A.x,t),y:lerp(R.y,A.y,t),w:lerp(R.w,A.w,t),h:lerp(R.h,A.h,t)};
    setFlyRect(q,lerp(12,20,clamp01(t))); const s=Math.min(q.w/A.w,q.h/A.h);
    card.style.transform=`translate(${(q.w-A.w*s)/2}px,${(q.h-A.h*s)/2}px) scale(${s})`; };
  opTx.set("p",0);
  go(opTx,"p",{to:1,spring:[S.openDur,S.openB]},()=>doneOpen());
}
/* ✓ or ✕ on a bill opened from All bills: the editor goes down and All bills comes back, the card in its place */
function backToBills(){
  const b=billsFrom; billsFrom=null; ui.busy=true; nameIn.blur();
  closeSheet();
  phase="bills"; billsF.style.visibility="visible"; billsTx.set("y",billsH());
  lat(.12,()=>{ if(b) b.el.style.visibility=""; go(billsTx,"y",{to:0,spring:[.45,.15]}); });
}

function buildBillsTopic(ab){
  const sec=ctl.querySelector('.topic[data-t="bills"]'); if(!sec||sec.dataset.built) return; sec.dataset.built=1;
  sec.insertAdjacentHTML("beforeend",`<h2>All bills as</h2><div class="opts" id="bopts"></div><div class="ios" id="bios"></div>`);
  const ob=sec.querySelector("#bopts");
  ab.OPTS.forEach(([k,l,d])=>{ const bt=document.createElement("button"); bt.className="opt bopt"; bt.dataset.bk=k; bt.innerHTML=`<b>${l}</b><span>${d}</span>`;
    bt.addEventListener("click",()=>choose({ab_dir:k})); ob.appendChild(bt); });
  ab.GROUPS.forEach(([which,title,rows])=>{
    if(title==="Look"||title==="View"||which==="drawn") return;
    const g=document.createElement("div"); g.dataset.bwhich=which; g.insertAdjacentHTML("beforeend",`<h2>${title}</h2>`);
    rows.forEach(([label,desc,opts])=>{
      const wrap=document.createElement("div"); wrap.className="step";
      wrap.innerHTML=`<div class="sl">${label}</div><div class="chips"></div>`+(desc?`<p class="desc">${desc}</p>`:"");
      const box=wrap.querySelector(".chips"), chips=[];
      opts.forEach(([l,vals])=>{ const pv={}; Object.keys(vals).forEach(k=>pv["ab_"+k]=vals[k]);
        const bt=document.createElement("button"); bt.className="chip"; bt.textContent=l; box.appendChild(bt);
        bt.addEventListener("click",()=>choose(pv)); chips.push({b:bt,vals:pv}); });
      chipRows.push(chips); g.appendChild(wrap);
    });
    groupEls.push(g); sec.appendChild(g);
  });
}

/* =====================================================================================================
   THE MONTH AND THE YEAR — whichever level is open, the bill lands as that level draws it
   ===================================================================================================== */
const monthV=$("monthV"), yearV=$("yearV");
let added=null, monthShown={y:TODAY.y,m:TODAY.m}, snap0=null;
const money0=v=>"€"+Math.round(v).toLocaleString("en-US");
function itemsOf(y,m){
  const mo=months.get(mkey(y,m));
  if(mo) return mo.items;
  const items=BASE.map(b=>({name:b[0],emoji:b[1],amt:b[2],day:b[3],extra:false}));
  ONEOFFS.forEach(o=>{ if(o[3]===y&&o[4]===m) items.push({name:o[0],emoji:o[1],amt:o[2],day:o[5],extra:true,cat:o[6]}); });
  if(added&&added.ld.monthly&&mkey(y,m)>mkey(added.ld.y,added.ld.m)) items.push(Object.assign({},added.it,{start:false}));
  return items;
}
function figFor(y,m){
  const items=itemsOf(y,m);
  if(y===TODAY.y&&m===TODAY.m) return money(items.filter(i=>i.day>=TODAY.d).reduce((s,i)=>s+i.amt,0))+" left";
  return money(items.reduce((s,i)=>s+i.amt,0));
}
const YEAR=[...Array(12)].map((_,i)=>{ const k=mkey(TODAY.y,TODAY.m)+i; return {y:Math.floor(k/12),m:k%12}; });
const totalOf=(y,m)=>itemsOf(y,m).reduce((s,i)=>s+i.amt,0);
const yearSum=()=>YEAR.reduce((s,x)=>s+totalOf(x.y,x.m),0);
function takeSnap(){ return {month:figFor(monthShown.y,monthShown.m), totals:YEAR.map(x=>money0(totalOf(x.y,x.m))), sum:money0(yearSum())}; }
const isNewIn=(it)=>it.isNew;

function rollText(box,now){
  const old=box.querySelector("span");
  if(!old||old.textContent===now) return;
  if(S.figure==="jump"||S.reduce){ box.innerHTML=`<span>${now}</span>`; return; }
  const down=document.createElement("span"); down.textContent=now; box.appendChild(down);
  const ot=new Tx(old), nt=new Tx(down,{y:18,op:0});
  go(ot,"y",{to:-18,spring:[.35,0]}); go(ot,"op",{to:0,ease:[.15,"out"]},()=>old.remove());
  go(nt,"y",{to:0,spring:[.35,.15]}); go(nt,"op",{to:1,ease:[.2,"out"]});
}

/* the month: a grid from Monday, each day its costliest charges' emoji and its total */
function renderMonth(o){
  const {y,m}=monthShown, first=(new Date(y,m,1).getDay()+6)%7, n=new Date(y,m+1,0).getDate(), items=itemsOf(y,m);
  let cells="";
  for(let i=0;i<first;i++) cells+=`<div class="mc"></div>`;
  for(let d=1;d<=n;d++){
    const day=items.filter(i=>i.day===d).sort((a,b)=>b.amt-a.amt);
    const shown=o&&o.hideNew?day.filter(i=>!i.isNew):day;
    const em=day.slice(0,2).map(i=>`<span class="${i.isNew?"nw":""}"${i.isNew&&o&&o.hideNew?' style="opacity:0"':""}>${i.emoji}</span>`).join("")+(day.length>2?`<small>+${day.length-2}</small>`:"");
    const tot=shown.length?money0(shown.reduce((s,i)=>s+i.amt,0)):"";
    const today=y===TODAY.y&&m===TODAY.m&&d===TODAY.d, up=mkey(y,m)>mkey(TODAY.y,TODAY.m)||(y===TODAY.y&&m===TODAY.m&&d>=TODAY.d);
    cells+=`<div class="mc${up?" up":""}" data-d="${d}"><div class="md${today?" today":""}">${d}</div><div class="me">${em}</div><div class="mt"><span>${tot}</span></div></div>`;
  }
  monthV.innerHTML=`<div class="mh"><div class="mn">${mname({y,m})}</div><div class="mf"><span>${o&&o.fig||figFor(y,m)}</span></div></div>
    <div class="wk">${["M","T","W","T","F","S","S"].map(x=>`<span>${x}</span>`).join("")}</div><div class="mgrid">${cells}</div>`;
}
/* the year: twelve months from this one, a dot per day with charges; colour for an extra, a ring where a bill starts */
function renderYear(o){
  let cells="";
  YEAR.forEach(({y,m},i)=>{
    const items=itemsOf(y,m), first=(new Date(y,m,1).getDay()+6)%7, n=new Date(y,m+1,0).getDate();
    let dots="";
    for(let k=0;k<first;k++) dots+=`<i></i>`;
    for(let d=1;d<=n;d++){
      const day=items.filter(x=>x.day===d), nw=day.find(x=>x.isNew), old=day.filter(x=>!x.isNew);
      const today=y===TODAY.y&&m===TODAY.m&&d===TODAY.d;
      const mark=list=>{ if(!list.length) return ""; const ex=list.find(x=>x.extra); const st=list.find(x=>x.start);
        if(ex) return `<b style="background:${catHex(ex.cat)}"></b>`; if(st) return `<b class="ring"></b>`; return `<b></b>`; };
      let inner=mark(old);
      if(nw&&o&&o.hideNew){ inner+=`<em class="nd" style="opacity:0">${mark([nw])}</em>`; }
      else if(nw&&!old.length) inner=mark(day); else if(nw) inner=mark(day);
      dots+=`<i class="${today?"td":""}">${inner}</i>`;
    }
    const tot=o&&o.totals?o.totals[i]:money0(totalOf(y,m));
    cells+=`<div class="ym" data-k="${mkey(y,m)}"><div class="ymn">${MNAMES[m].slice(0,3)}${y!==TODAY.y?` ’${String(y).slice(2)}`:""}</div><div class="ydots">${dots}</div><div class="ymt"><span>${tot}</span></div></div>`;
  });
  yearV.innerHTML=`<div class="mh"><div class="mn">Oct – Sep</div><div class="mf"><span>${o&&o.sum||money0(yearSum())}</span></div></div><div class="ygrid">${cells}</div>`;
}
function showView(){
  list.style.display=S.view==="days"?"":"none"; monthV.style.display=S.view==="month"?"":"none"; yearV.style.display=S.view==="year"?"":"none";
  $("backB").style.visibility=S.view==="year"?"hidden":"";
  $("backB").innerHTML=`<b>‹</b> ${S.view==="days"?"October":"Year"}`;
  if(S.view==="month") renderMonth(); if(S.view==="year") renderYear();
}
/* the mark drops into its day as the sheet drops, and the figures roll */
function playMonth(){
  const ld=LANDS[S.lands];
  if(monthShown.y!==ld.y||monthShown.m!==ld.m){ // off screen: a pill says where it went
    offpill.innerHTML=`Added to ${mname({y:ld.y,m:ld.m})}<i>›</i>`; offpill.style.display="block"; phase="pill";
    go(pillTx,"s",{from:.9,to:1,spring:[.35,.5]}); return;
  }
  rollText(monthV.querySelector(".mf"),figFor(ld.y,ld.m));
  const cell=monthV.querySelector(`.mc[data-d="${ld.d}"]`), em=cell&&cell.querySelector(".nw");
  if(em){ em.style.opacity=""; const t=new Tx(em,{y:-28,op:0}); go(t,"y",{to:0,spring:[S.fallDur,S.fallB]}); go(t,"op",{to:1,ease:[.15,"out"]});
    lat(S.fallDur*.4,()=>{ haptic("light"); rollText(cell.querySelector(".mt"),money0(itemsOf(ld.y,ld.m).filter(i=>i.day===ld.d).reduce((s,i)=>s+i.amt,0))); }); }
  endSoon(S.fallDur+.5);
}
function playYear(){
  const ld=LANDS[S.lands];
  rollText(yearV.querySelector(".mf"),money0(yearSum()));
  const nds=[...yearV.querySelectorAll(".nd")];
  nds.forEach((nd,i)=>{
    const t=new Tx(nd,{y:-10,s:.2,op:0}); nd.style.opacity="";
    lat(i*.05,()=>{ if(!i) haptic("light"); go(t,"y",{to:0,spring:[.4,.3]}); go(t,"s",{to:1,spring:[.4,.3]}); go(t,"op",{to:1,ease:[.12,"out"]});
      const ym=nd.closest(".ym"), k=+ym.dataset.k; rollText(ym.querySelector(".ymt"),money0(totalOf(Math.floor(k/12),k%12))); });
  });
  endSoon(nds.length*.05+.7);
}
function viewPillTap(){
  const ld=LANDS[S.lands];
  offpill.style.display="none"; phase="landing";
  monthShown={y:ld.y,m:ld.m}; renderMonth({hideNew:true,fig:figFor(ld.y,ld.m)});
  const t=new Tx(monthV,{x:40,op:0}); go(t,"x",{to:0,spring:[.4,0]}); go(t,"op",{to:1,ease:[.2,"out"]});
  lat(.3,playMonth);
}

 ["highlight","Highlight",[
  ["Tint","The wash's colour.",[["Folder colour",{hlTint:"cat"}],["Grey",{hlTint:"grey"}]]],
  ["Fade","How long the wash takes to fade away.",[["Quick",{hlFade:.8}],["Normal",{hlFade:1.5}],["Slow",{hlFade:2.5}]]],
  ["Pulse","Whether the row also swells once, slightly.",onOff("hlPulse")]]],
 ["slam","Slam",[
  ["Height","How far above the page the row starts, as a scale.",[["Low",{slamFrom:1.25}],["Medium",{slamFrom:1.5}],["High",{slamFrom:2}]]],
  ["Ripple","Push shoves the neighbours away and back; Wave swells them in turn.",[["Off",{ripple:"off"}],["Push",{ripple:"push"}],["Wave",{ripple:"wave"}]]],
  ["Reach","How many rows either side feel it.",[["Near",{reach:2}],["Middle",{reach:4}],["Far",{reach:8}]]],
  ["Strength","How hard the nearest rows move.",[["Soft",{strength:3}],["Medium",{strength:6}],["Strong",{strength:10}]]],
  ["Shake","Whether the whole list jolts sideways on impact, as iMessage's does.",onOff("shake")]]],
 ["slide","Slide in",[
  ["From","Which way the row comes in.",[["Right",{slideFrom:"right"}],["Left",{slideFrom:"left"}],["Below",{slideFrom:"below"}]]],
  ["Gap","Whether the gap opens first, or as the row comes in.",[["First",{slideGap:"before"}],["Together",{slideGap:"together"}]]],
  ["Feel",D_FEEL,feel("slideB")],["Speed","How long the slide takes to settle.",speed("slideDur")]]],
 ["slip","Slip flies",[
  ["Path","Straight across, or a curve.",[["Straight",{flyPath:"straight"}],["Arc",{flyPath:"arc"}]]],
  ["Gap","Whether the gap is waiting as the sheet drops, or opens as the slip arrives.",[["Waiting",{flyGap:"early"}],["On arrival",{flyGap:"arrival"}]]],
  ["Feel",D_FEEL,feel("flyB")],["Speed","How long the flight takes.",speed("flyDur",[["Quick",.45],["Normal",.6],["Slow",.8]])]]],
 ["zoom","Zoom in",[
  ["Feel",D_FEEL,feel("zoomB")],["Speed","How long the sheet takes to close into the row.",speed("zoomDur",[["Quick",.35],["Normal",.45],["Slow",.6]])]]],
 ["timing","After it lands",[
  ["Starts","Whether the row's moment starts while the sheet is still dropping, or once it's gone. Fall in, Highlight, Slam and Slide in.",[["With the drop",{overlap:"with"}],["After",{overlap:"after"}]]],
  ["Then highlight","Whether a moving row also gets the fading wash once it's in place.",onOff("glow")]]],
 ["all","Sheet",[
  ["Exit","Soft: the sheet's contents fade first, it drops a little slower, and the list comes up from under a light dim. Plain: the sheet drops as it is.",[["Soft",{sheetExit:"soft"}],["Plain",{sheetExit:"plain"}]]]]],
 ["all","Where it lands",[
  ["Open on","Which level of the calendar is behind the sheet. The month and the year use Fall in's motion whatever is picked above.",[["Days",{view:"days"}],["Month",{view:"month"}],["Year",{view:"year"}]]],
  ["Sheet drop","How long the sheet takes to drop away. Slow makes Set down easier to watch.",[["Quick",{sheetDur:.35}],["Slow",{sheetDur:.55}],["Slower",{sheetDur:.8}]]],
  ["Date","Which day the card is for. Next March is a yearly bill, months above the screen.",[["Oct 18",{lands:"week"}],["Oct 30",{lands:"month"}],["Next March",{lands:"march"}]]],
  ["Off screen","When the row lands out of view. Pill says where it went and waits for a tap; Scroll goes there after the sheet drops; Jump is already there when it uncovers. Zoom in always jumps.",[["Pill",{offMode:"pill"}],["Scroll",{offMode:"scroll"}],["Jump",{offMode:"jump"}]]],
  ["Month figure","How October's figure changes when the bill adds to it.",[["Rolls",{figure:"roll"}],["Jumps",{figure:"jump"}]]]]],
 ["all","View",[
  ["Haptics","Shows a marker where the phone would give a tap you can feel.",onOff("haptics")],
  ["Reduce Motion","Plays it as iOS's Reduce Motion would: fades instead of movement.",onOff("reduce")],
  ["Dark","",onOff("dark")],
  ["Slow motion","Slows everything down, to watch a moment closely.",[["1×",{slow:1}],["½×",{slow:.5}],["¼×",{slow:.25}]]]]],
];
const same=(a,b)=>typeof a==="number"&&typeof b==="number"?Math.abs(a-b)<1e-6:a===b;
const matches=vals=>Object.keys(vals).every(k=>same(S[k],vals[k]));
const ctl=document.createElement("div"); ctl.className="ctl";
const chipRows=[], groupEls=[];

/* =====================================================================================================
   TOPICS — each part of the flow is decided on its own: its own controls, its own A/B/C, and Settle
   ===================================================================================================== */
const TOPICS=[
 {id:"look",name:"Look",intro:"How every card looks, in the editor and in the list. Settle this first: the other topics are judged in it."},
 {id:"entry",name:"Entry",intro:"Making the card: how a category is picked."},
 {id:"landing",name:"Landing",intro:"What happens after ✓: the card leaves the sheet and becomes its row."},
 {id:"bills",name:"All bills",intro:"The list button's sheet: every bill, in its category's folder. Tap ☰ on the timeline to open it, and a card in it to open that bill. Its choices were made in its own prototype; pick them again here to settle them."},
 {id:"open",name:"Opening",intro:"Tapping a card in the timeline: how it becomes the editor's card, and how ✓ or ✕ sends it back. Add a bill first, then tap any card."},
];
const TOPIC_OF_GROUP={"Tilly, Drawn":"look","Skin":"look","Opening a bill":"open","Timeline look":"look","Cards":"look","Picking a category":"entry","View":"view"};
const topicKeys={look:["skin","sheetLook","drawDir","look","tone"],entry:["picker"],open:["openStyle","openDur","openB"]};
topicKeys.landing=LKEYS.filter(k=>!topicKeys.look.includes(k)&&!topicKeys.entry.includes(k)&&!topicKeys.open.includes(k));
const pickKeys=(t,src)=>{ const o={}; (topicKeys[t]||[]).forEach(k=>{ if(src&&k in src) o[k]=src[k]; }); return o; };

/* the record: per topic, three slots and what was settled. Kept in this browser and, where the page can, with the
   artifact itself, so it follows Jake between phone and desktop and Claude can read what was settled */
const FLOWKEY="tilly-flow";
let flow={slots:{},settled:{},tab:"landing"};
try{ const j=JSON.parse(localStorage.getItem(FLOWKEY)||"null"); if(j) flow=Object.assign(flow,j); }catch(e){}
// first run here: the landing prototype's A, B and C become each topic's
if(!flow.migrated){
  try{ const old=JSON.parse(localStorage.getItem("tilly-card-landing-slots")||"{}")||{};
    ["A","B","C"].forEach(Lt=>{ const v=old[Lt]; if(!v) return;
      TOPICS.forEach(t=>{ const p=pickKeys(t.id,v); if(Object.keys(p).length){ (flow.slots[t.id]=flow.slots[t.id]||{})[Lt]=p; } }); });
  }catch(e){}
  flow.migrated=true;
}
let activeSlot={};
let dbRef=null, pushT=0;
function current(){ const o={}; TOPICS.forEach(t=>o[t.id]=pickKeys(t.id,S)); return o; }
function persist(){
  try{ localStorage.setItem(FLOWKEY,JSON.stringify(flow)); }catch(e){}
  if(!dbRef) return;
  clearTimeout(pushT);
  pushT=setTimeout(()=>{ dbRef.set({slots:flow.slots,settled:flow.settled,current:current(),updated:new Date().toISOString()})
    .then(()=>syncNote("Saved with the prototype")).catch(()=>syncNote("Saved in this browser only")); },800);
}
function syncNote(t){ const n=ctl.querySelector("#syncNote"); if(n) n.textContent=t; }
(async()=>{
  try{
    const db=window.claude&&await claude.use("db"); if(!db){ syncNote("Saved in this browser only"); return; }
    dbRef=db.doc("flow/state");
    const snap=await dbRef.get();
    if(snap.exists){ const d=snap.data()||{};
      // the shared record wins for slots and settled topics; anything only here is added to it
      ["slots","settled"].forEach(k=>{ const local=flow[k]||{}, remote=d[k]||{};
        flow[k]=Object.assign({},local,remote);
        Object.keys(local).forEach(t=>{ if(k==="slots") flow[k][t]=Object.assign({},local[t],remote[t]||{}); }); });
      syncControls();
    }
    persist();
  }catch(e){ syncNote("Saved in this browser only"); }
})();

function topicState(t){
  const s=flow.settled[t]; if(!s) return "open";
  return Object.keys(s.values).every(k=>same(S[k],s.values[k]))?"settled":"drift";
}
function buildControls(){
  ctl.insertAdjacentHTML("beforeend",`<button id="replayB">Play it again</button><div class="tabs" id="tabs"></div><div id="topics"></div>
    <div id="viewBox"></div><p class="sync" id="syncNote"></p>`);
  const tabs=ctl.querySelector("#tabs"), topics=ctl.querySelector("#topics");
  TOPICS.forEach(t=>{
    const b=document.createElement("button"); b.className="tab"; b.dataset.t=t.id; b.innerHTML=`<i></i>${t.name}`;
    b.addEventListener("click",()=>{ flow.tab=t.id; persist(); syncControls(); }); tabs.appendChild(b);
    const sec=document.createElement("section"); sec.className="topic"; sec.dataset.t=t.id;
    sec.innerHTML=`<p class="desc">${t.intro}</p><div class="tbar"><div class="row"><span class="st"></span><button class="settleB"></button></div>
      <div class="slots"></div></div>`;
    const sl=sec.querySelector(".slots");
    ["A","B","C"].forEach(Lt=>{
      const g=document.createElement("div"); g.className="slot";
      g.innerHTML=`<button class="chip load">${Lt}</button><button class="save">Save</button>`;
      g.querySelector(".load").addEventListener("click",()=>{ const v=(flow.slots[t.id]||{})[Lt]; if(!v) return; Object.assign(S,v); activeSlot[t.id]=Lt; afterChange(Object.keys(v)); });
      g.querySelector(".save").addEventListener("click",()=>{ (flow.slots[t.id]=flow.slots[t.id]||{})[Lt]=pickKeys(t.id,S); activeSlot[t.id]=Lt; persist(); syncControls(); toast(t.name+" saved to "+Lt); });
      sl.appendChild(g);
    });
    sec.querySelector(".settleB").addEventListener("click",()=>{
      if(topicState(t.id)==="settled") delete flow.settled[t.id];
      else { flow.settled[t.id]={values:pickKeys(t.id,S),at:new Date().toISOString()}; toast(t.name+" settled"); }
      persist(); syncControls();
    });
    topics.appendChild(sec);
  });
  const land=topics.querySelector('[data-t="landing"]');
  land.insertAdjacentHTML("beforeend",`<h2>Landing</h2><div class="opts" id="opts"></div><div class="ios" id="ios"></div>`);
  const ob=land.querySelector("#opts");
  OPTS.forEach(([k,l,d])=>{ if(k==="fall"||k==="highlight") ob.insertAdjacentHTML("beforeend",`<div class="ohead">${k==="fall"?"One direction":"From before"}</div>`); const b=document.createElement("button"); b.className="opt"; b.dataset.k=k; b.innerHTML=`<b>${l}</b><span>${d}</span>`;
    b.addEventListener("click",()=>choose({opt:k})); ob.appendChild(b); });
  GROUPS.forEach(([which,title,rows])=>{
    const g=document.createElement("div"); g.dataset.which=which; g.insertAdjacentHTML("beforeend",`<h2>${title}</h2>`);
    rows.forEach(([label,desc,opts])=>{
      const wrap=document.createElement("div"); wrap.className="step";
      wrap.innerHTML=`<div class="sl">${label}</div><div class="chips"></div>`+(desc?`<p class="desc">${desc}</p>`:"");
      const box=wrap.querySelector(".chips"), chips=[];
      opts.forEach(([l,vals])=>{ const b=document.createElement("button"); b.className="chip"; b.textContent=l; box.appendChild(b);
        b.addEventListener("click",()=>choose(vals)); chips.push({b,vals}); });
      chipRows.push(chips); g.appendChild(wrap);
    });
    groupEls.push(g);
    const tp=TOPIC_OF_GROUP[title]||"landing";
    (tp==="view"?ctl.querySelector("#viewBox"):topics.querySelector(`[data-t="${tp}"]`)).appendChild(g);
    if(title==="Timeline look") g.insertAdjacentHTML("beforeend",'<div class="lookbox" id="lookbox"></div>');
  });
  ctl.querySelector("#viewBox").insertAdjacentHTML("beforeend",'<h2>What it lies about</h2><ul class="lies"><li>The sheet is drawn here, not the system sheet, and the list doesn\'t decelerate like a real scroll view.</li><li>No real haptics: the markers stand in.</li><li>The ripple moves whole rows; a shader ripple would bend them.</li><li>No Liquid Glass, no Dynamic Type.</li><li>Frame timing isn\'t ProMotion\'s.</li><li>The filing on ✓ is the card polish prototype\'s Video setup, whatever is picked there.</li></ul>');
  ctl.querySelector("#replayB").onclick=()=>replay();
}
const LOOKS={
 plain:["Today","Grey wells and plain rows, as DESIGN.md has them now. The card stops being a card the moment it lands."],
 chip:["Card chip","Every row's well is that bill's card, shrunk to a chip in its category colour. Card leads lands the card straight into the chip, so the thing you made is the thing you can still see."],
 paper:["Dashed and solid","Rows become paper cards. A charge still to come is dashed, the way the editor dashes a part that isn't filled in yet; once it's charged it's a solid card."],
 stack:["Wallet stack","The rows are the cards themselves, each tucked under the next like cards in Wallet. Charged cards are solid; ones still to come are a dotted outline in their colour, with their words set back."]};
function setLook(){
  phone.classList.remove("lk-plain","lk-chip","lk-paper","lk-stack"); phone.classList.add("lk-"+S.look);
  phone.classList.toggle("tone-cream",S.tone==="cream");
  phone.classList.toggle("sh-glass",S.sheetLook==="glass");
  const lb=ctl.querySelector("#lookbox"); if(lb){ const l=LOOKS[S.look]; lb.innerHTML=`<p><b>${l[0]}.</b> ${l[1]}</p>`; }
}
function choose(vals){ Object.assign(S,vals); TOPICS.forEach(t=>{ if(Object.keys(vals).some(k=>(topicKeys[t.id]||[]).includes(k))) activeSlot[t.id]=null; }); afterChange(Object.keys(vals)); }
function afterChange(keys){
  if(keys.includes("dark")){ S.darkTouched=true; applyTheme(); }
  if(keys.includes("view")&&phase==="edit") showView();
  if(keys.includes("picker")) replay();
  if(["look","tone","skin","drawDir","dark","sheetLook"].some(k=>keys.includes(k))){ setLook(); applySkin(); if(phase==="edit"){ paintFaces(); renderCard(); } buildHand(); if(phase==="edit"&&S.picker==="hand") layoutHand(false); }
  if(keys.includes("lands")&&phase==="edit"){ bill.date=LANDS[S.lands].date; bill.repeat=LANDS[S.lands].rep; renderCard(); }
  if(keys.some(k=>k.startsWith("ab_")||k==="dark"||k==="skin"||k==="reduce"||k==="slow")) pushBills(keys.filter(k=>k.startsWith("ab_")));
  syncControls(); save(); persist();
}
function syncControls(){
  chipRows.forEach(chips=>chips.forEach(({b,vals})=>b.classList.toggle("on",matches(vals))));
  ctl.querySelectorAll(".opt[data-k]").forEach(b=>b.classList.toggle("on",S.opt===b.dataset.k));
  groupEls.forEach(g=>{
    if(g.dataset.bwhich){ const w=g.dataset.bwhich; g.style.display=(w==="all"||w===S.ab_dir||(w==="drawn"&&S.skin==="drawn"))?"":"none"; return; }
    const w=g.dataset.which; g.style.display=(w==="all"||w===S.opt||(w==="timing"&&S.opt!=="highlight"))?"":"none"; });
  ctl.querySelectorAll(".bopt").forEach(b=>b.classList.toggle("on",S.ab_dir===b.dataset.bk));
  const bio=ctl.querySelector("#bios"); if(bio&&AB){ const io=AB.IOS[S.ab_dir]; if(io) bio.innerHTML=`<span class="feas" style="background:${io[1]}">${io[0]}</span>${io[2]}`; }
  const io=IOS[S.opt]; const iosEl=ctl.querySelector("#ios"); if(iosEl) iosEl.innerHTML=`<span class="feas" style="background:${io[1]}">${io[0]}</span>${io[2]}`;
  TOPICS.forEach(t=>{
    const st=topicState(t.id), tab=ctl.querySelector(`.tab[data-t="${t.id}"]`), sec=ctl.querySelector(`.topic[data-t="${t.id}"]`);
    tab.classList.toggle("on",flow.tab===t.id); tab.classList.toggle("settled",st==="settled"); tab.classList.toggle("drift",st==="drift");
    sec.hidden=flow.tab!==t.id;
    const when=flow.settled[t.id]?new Date(flow.settled[t.id].at).toLocaleDateString("en-US",{month:"short",day:"numeric"}):"";
    sec.querySelector(".st").innerHTML=st==="settled"?`<b>Settled</b> ${when}. This is what gets built.`
      :st==="drift"?`<b>Changed since you settled it</b> ${when}. Settle again to keep these, or load what you had.`
      :`<b>Open.</b> Try things, save to A, B or C, and settle when it's right.`;
    const sb=sec.querySelector(".settleB"); sb.textContent=st==="settled"?"Unsettle":st==="drift"?"Settle again":"Settle"; sb.classList.toggle("un",st==="settled");
    sec.querySelectorAll(".slot").forEach((g,i)=>{ const Lt="ABC"[i], has=!!(flow.slots[t.id]||{})[Lt];
      g.querySelector(".load").classList.toggle("on",activeSlot[t.id]===Lt); g.querySelector(".load").classList.toggle("empty",!has); });
  });
}
function applyTheme(){ document.documentElement.classList.toggle("dark",!!S.dark); if(ctlReady&&drawn()){ applySkin(); buildHand(); }
  if(ctlReady&&phase==="edit"){ paintFaces(); buildPockets(); renderCard(); } }
if(mq) mq.addEventListener&&mq.addEventListener("change",e=>{ if(!S.darkTouched){ S.dark=e.matches; syncControls(); applyTheme(); } });


const wideMq=matchMedia("(min-width:900px)");
function placeControls(){ if(wideMq.matches) $("panel").appendChild(ctl); else $("drawerBody").appendChild(ctl); }
wideMq.addEventListener&&wideMq.addEventListener("change",placeControls);
$("tuneBtn").addEventListener("click",()=>$("drawer").classList.add("open"));
$("dclose").addEventListener("click",()=>$("drawer").classList.remove("open"));
function fit(){
  const box=$("phoneBox");
  if(innerWidth<500){ box.style.width=box.style.height=""; phone.style.transform=""; return; }
  const avail=innerHeight-30, s=Math.min(1,avail/874);
  box.style.width=(402*s)+"px"; box.style.height=(874*s)+"px"; phone.style.transform=`scale(${s})`;
}
addEventListener("resize",()=>{ fit(); layout(); fitAmount(); });

/* =====================================================================================================
   BOOT
   ===================================================================================================== */
let ctlReady=false;
buildControls(); placeControls(); ctlReady=true; setLook();
document.documentElement.classList.toggle("dark",!!S.dark);
syncControls(); fit();
makeGrain(); buildData(); renderList(); applySkin(); restScroll(); showView();
resetBill(false); paintFaces(); buildPockets(); buildHand(); setPanelRaw(startPanel()); renderCard();
requestAnimationFrame(()=>{ if(S.picker==="hand") layoutHand(true); });
requestAnimationFrame(()=>{ layout(); fitAmount(); restScroll(); });
window.__cl={S,get phase(){return phase;},get L(){return L;},replay,months};

</script>
</body></html>
