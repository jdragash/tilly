<title>Tilly Card Prototype</title>
<!--
  Tilly · adding an expense, three endings mixed and matched · 2026-10-06

  Built during tilly-explore after prototype v7 (thirteen fixed variants, kept in git history at 24a81b0) and
  canvas rounds 3–7 (https://claude.ai/artifact/A8CUNvsPrYMjek5S2a64Rm). Only the three endings stay. The card,
  the pockets and the category picker are now controls that combine, so a direction can be assembled rather
  than chosen from a list.

  Questions it explores:
    1. Which ending: put it away (P1), play a category on then ✓ (P2), or pick a pocket then ✓ (P3)?
    2. Where does each part sit on the card, and how big is it, so the card reads in the order you fill it in?
    3. How should the date and repeat read: words, a Calendar tile, a countdown, chips, a postmark, a sentence?
    4. What could the card look like? (Possibilities ahead of the icons and colour exploration, not polish.)
    5. How does a pocket show what it holds: bills peeking, a count, stacked edges, a folder's thickness, a total?
    6. In P2, how are categories offered (hand, spread, icons, list, pockets), and how does the chosen one arrive
       (flying, a stamp, or both)?
    7. Does every picker and pocket arrangement still work with no categories, one, six and twenty-plus?
    8. How does the sheet sit in the app: grouped with a darker panel, one white piece, glass, or no sheet?
    9. Does a slow float make the card feel unfinished, something still in your hands until it's filed?

  So far Jake's favourite is P2, because it's "what you see is what you get": the card shows its category,
  colour included, before ✓ saves. Pockets holding the bills already in them are a strong concept.

  Direction chosen: not yet.

  Retained as a record of the work rather than as a spec. Where this disagrees with the docs, the docs win.
-->

/* ---------- the hand ---------- */
.hand{position:relative;height:100%;background:var(--panel);touch-action:none;-webkit-user-select:none;user-select:none;overflow:visible}
.hc{position:absolute;left:50%;top:40px;width:84px;height:120px;margin-left:-42px;border-radius:10px;background:var(--hcard);box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 6px 14px rgba(0,0,0,.16);transition:transform .3s cubic-bezier(.32,.72,0,1);overflow:hidden;cursor:grab;color:var(--fg)}
.hc::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c)}
.hc.g{box-shadow:0 0 0 2.5px var(--accent),0 12px 22px rgba(0,0,0,.22)}
.hpip{position:absolute;left:6px;top:5px;font-size:13px;line-height:1;display:flex;align-items:center;gap:1px;color:var(--accent)}
.hbig{position:absolute;left:0;right:0;top:33px;text-align:center;font-size:38px;line-height:1}
.hname{position:absolute;left:4px;right:4px;bottom:11px;text-align:center;font-size:11px;font-weight:600;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdash{position:absolute;left:50%;top:36px;width:42px;height:42px;margin-left:-21px;border-radius:21px;border:2px dashed var(--c)}
.hc.hnew{background:var(--panel);box-shadow:inset 0 0 0 2px var(--ter);color:var(--sec)}
.hc.hnew::after{display:none}
.hc.hnew .hbig{font-size:30px;top:38px;font-weight:300}
.hflyer{position:fixed;z-index:50;pointer-events:none}
/* P2: the spread, a loose row of cards that runs off the right edge */
.spr{position:relative;height:100%;background:var(--panel);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain;-webkit-user-select:none;user-select:none}
.spr::-webkit-scrollbar{display:none}
.sprin{position:relative;height:100%}
.hc.spc{left:var(--x);top:66px;width:96px;height:132px;margin-left:0;transform:translateY(var(--dy)) rotate(var(--rot));transition:transform .18s cubic-bezier(.32,.72,0,1);touch-action:pan-x}
.hc.spc.prs{transform:translateY(calc(var(--dy) - 8px)) rotate(0deg) scale(1.04)}
.spc .hbig{top:40px;font-size:44px}
.spc .hdash{top:42px;width:46px;height:46px;margin-left:-23px}
.spc .hname{font-size:12px;bottom:12px}
.hc.hnew.spc .hbig{top:44px}
.spflyer{z-index:55}
/* the card floats in a wrapper, so press feedback and flights never fight the float */
.flt{position:relative;transform-origin:50% 50%}
.flt.fl .lk-wallet{box-shadow:0 calc(13px + 3px * var(--fl,0)) calc(28px + 4px * var(--fl,0)) var(--wdrop)}
.flt.fl .bc:not(.lk-wallet){box-shadow:var(--ring),0 calc(8px + 3px * var(--fl,0)) calc(24px + 6px * var(--fl,0)) var(--drop)}
.hflyer > *{position:absolute!important;left:0!important;top:0!important;margin:0!important;width:100%!important;height:100%!important;transform:none!important;transition:none!important}

/* ---------- P2: icons and list pickers ---------- */
.icp,.lsp{height:100%;background:var(--panel);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.icp::-webkit-scrollbar,.lsp::-webkit-scrollbar{display:none}
.icg{display:grid;grid-template-columns:repeat(5,56px);justify-content:center;gap:16px 14px;padding:20px 12px calc(var(--home) + 16px)}
.ic56{position:relative;width:56px;height:56px;border-radius:28px;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--w-on);box-shadow:0 3px 8px var(--pkshade)}
.ic56.g{box-shadow:0 0 0 3px var(--panel),0 0 0 5.5px var(--accent),0 6px 14px var(--pkshade)}
.ic56.on{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--fg)}
.ic56.blank{background:none;border:2.5px dashed var(--c);box-shadow:none}
.ic56.nw{background:none;border:2px dashed var(--ter);color:var(--sec);box-shadow:none;font-size:26px;font-weight:300}
.ic56 .spk,.lrow .spk{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.ic56 .spk svg{width:12px;height:12px}
.lsg{margin:16px 16px calc(var(--home) + 16px);background:var(--optcard);border-radius:12px;overflow:hidden}
.lrow{position:relative;width:100%;height:48px;display:flex;align-items:center;gap:12px;padding:0 16px 0 10px;border-bottom:.5px solid var(--hair);text-align:left;font-size:17px}
.lrow:last-child{border-bottom:0}
.lrow.on{background:var(--accent-soft)}
.ltile{position:relative;flex:none;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;background:color-mix(in srgb,var(--c) 22%,transparent)}
.ltile.nw{background:none;border:1.5px dashed var(--ter);color:var(--sec)}
.lname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow.nw .lname{color:var(--accent)}
.lrow .lspk{color:var(--accent);display:flex;flex:none}
.lrow .lck{color:var(--accent);font-weight:600;flex:none}

/* ---------- pockets ---------- */
.pkts{height:100%;background:var(--panel);display:flex;flex-direction:column;--pkw:108px;--pkh:86px;--liph:46px;--lipfs:13px;--toph:34px;--topfs:11px}
.pkts.arr-dense{--pkw:80px;--pkh:66px;--liph:34px;--lipfs:11px;--toph:26px;--topfs:10px}
.pkscroll{flex:1;min-height:0;overflow-y:auto;padding:20px 12px calc(var(--home) + 14px);touch-action:pan-y;scrollbar-width:none;overscroll-behavior:contain}
.pkscroll::-webkit-scrollbar{display:none}
.pkts.shelf .pkscroll{padding:16px 12px 8px}
.pkts.static{pointer-events:none}
.putw{flex:none;padding:4px 16px calc(var(--home) + 10px)}
.putb{width:100%;height:54px;border-radius:27px;color:var(--w-on);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.14);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 16px}
.putb[aria-disabled="true"]{background:var(--fill);color:var(--ter);box-shadow:none;cursor:default}
.putb.make{background:var(--accent)}
.pkts.enter .pk{animation:pkIn .3s cubic-bezier(.32,.72,0,1) both;animation-delay:calc(var(--i) * 30ms)}
.pkts.nudge .pk:not(.new){animation:pkNudge .7s ease-in-out .45s 1}
.pkts.enter.nudge .pk:not(.new){animation:pkIn .3s cubic-bezier(.32,.72,0,1) both,pkNudge .7s ease-in-out .45s 1;animation-delay:calc(var(--i) * 30ms),.45s}
.pk.fresh{animation:pkFresh .24s ease-out both}
.pkts.enter .pk.new.pulse{animation:pkIn .3s cubic-bezier(.32,.72,0,1) both,pulse 1.8s ease-in-out .3s infinite}
.noPulse .pkts.enter .pk.new.pulse{animation:pkIn .3s cubic-bezier(.32,.72,0,1) both}
.pkts .pk.tgt{animation:none}
@keyframes pkIn{from{opacity:0;translate:0 26px}to{opacity:1;translate:0 0}}
@keyframes pkNudge{0%,100%{scale:1}45%{scale:1.05}}
@keyframes pkFresh{from{opacity:0;scale:.9}to{opacity:1;scale:1}}
.pkgrid{display:grid;grid-template-columns:repeat(3,var(--pkw));justify-content:center;gap:22px 14px;padding-top:4px}
.arr-dense .pkgrid{grid-template-columns:repeat(4,var(--pkw));gap:18px 10px}
.arr-row .pkscroll{display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;touch-action:pan-x;padding:16px 0}
.arr-row.shelf .pkscroll{padding:8px 0}
.arr-row .pkgrid{display:flex;gap:14px;padding:14px 20px 4px;width:max-content}
.arr-row .pk{flex:none;scroll-snap-align:center}
.pk{position:relative;width:var(--pkw);height:var(--pkh);transition:transform .25s cubic-bezier(.32,.72,0,1),opacity .2s;cursor:pointer}
.pk.g,.pk.has,.pk.sel{transform:translateY(-6px)}
.pk.sel .pback{box-shadow:0 0 0 2.5px var(--accent)}
.pk.sel .plip{transform:translateY(5px)}
.pkts.dragging .pk:not(.open){opacity:.55}
.pback{position:absolute;inset:0;border-radius:12px;background:color-mix(in srgb,var(--c) 35%,transparent);transition:transform .2s cubic-bezier(.32,.72,0,1)}
.pk.g .pback{box-shadow:0 0 0 2.5px var(--accent)}
.ptop,.pghost{position:absolute;left:10px;right:10px;height:var(--toph);border-radius:6px;font-size:var(--topfs);line-height:1.1;font-weight:600;padding:2px 7px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop{background:var(--ptop);color:var(--ptop-fg);box-shadow:0 -1px 3px rgba(0,0,0,.14)}
.pghost{background:color-mix(in srgb,var(--ptop) 70%,transparent);color:var(--ptop-fg);box-shadow:0 -1px 3px rgba(0,0,0,.12)}
.pghost.dashed{background:color-mix(in srgb,var(--ptop) 30%,transparent);border:1.5px dashed var(--ptop);box-shadow:none;padding-top:1px}
.pcard{position:absolute;left:6px;right:6px;top:calc(var(--pkh) - var(--liph) - 10px);height:calc(var(--liph) + 15px);border-radius:7px;color:var(--w-on);padding:5px 7px;display:flex;flex-direction:column;gap:1px;font-size:11px;font-weight:700;line-height:13px;box-shadow:0 -2px 6px rgba(0,0,0,.2);touch-action:none;cursor:grab;overflow:hidden}
.pcard span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.plip{position:absolute;left:0;right:0;bottom:0;height:var(--liph);border-radius:10px 10px 12px 12px;opacity:.95;color:var(--w-on);font-size:var(--lipfs);font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px;white-space:nowrap;transition:transform .2s cubic-bezier(.32,.72,0,1);box-shadow:0 -2px 6px var(--pkshade)}
.plip .lnm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.plip .lspk{display:flex;flex:none}
.plip > span:not(.lnm):not(.sl-l):not(.sl-r){flex:none}
.pk.open .plip{transform:translateY(10px)}
.pk.open .pback{transform:translateY(-3px)}
.pk.new .pback{background:transparent;border:2px dashed var(--ter)}
.pk.new .plip{background:transparent;color:var(--sec);box-shadow:none;opacity:1}
.pk.new.pull .pback{border-color:var(--accent);background:var(--accent-soft)}
.pk.new.pull .plip{color:var(--accent)}
/* what a pocket shows */
.pcount{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--card);color:var(--fg);box-shadow:var(--ebsh);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;z-index:3}
.pedge{position:absolute;left:10px;right:10px;height:4px;border-radius:2px;box-shadow:0 -.5px 1px var(--pkshade)}
.ptot{position:absolute;left:4px;right:4px;top:7px;text-align:center;font-size:12px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arr-dense .ptot{font-size:10px;top:5px}
.show-folder .pk:not(.strip):not(.new) .pback{top:12px;border-radius:4px 10px 10px 10px;background:color-mix(in srgb,var(--c) 32%,var(--card))}
.ftab{position:absolute;left:0;top:0;height:16px;padding:0 9px;border-radius:7px 7px 0 0;background:color-mix(in srgb,var(--c) 32%,var(--card));font-size:11px;line-height:1;display:flex;align-items:center;transition:transform .2s cubic-bezier(.32,.72,0,1)}
.pk.open .ftab{transform:translateY(-3px)}
.arr-dense .ftab{height:14px;font-size:10px;padding:0 7px}
.ppaper{position:absolute;left:7px;right:7px;height:1.5px;border-radius:1px;background:var(--ptop);box-shadow:0 0 0 .5px var(--pkshade)}
.show-folder .plip{border-radius:4px 4px 10px 10px}
/* list arrangement: Wallet-style strips */
.arr-list .pkscroll{padding:16px 14px calc(var(--home) + 14px)}
.arr-list.shelf .pkscroll{padding:12px 14px 8px}
.arr-list .pkgrid{display:flex;flex-direction:column;gap:0;padding-top:6px}
.pk.strip{width:auto;height:72px;margin-top:-28px}
.pk.strip:first-child{margin-top:0}
.arr-list.tight .pk.strip{height:60px}
.pk.strip .pback{background:var(--c);border-radius:14px;box-shadow:0 -2px 8px var(--pkshade)}
.pk.strip .pback.gr{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 72%,var(--mixlight)) 0%,var(--c) 50%,color-mix(in srgb,var(--c) 76%,var(--mixdark)) 100%)}
.pk.strip .plip{top:0;bottom:auto;height:44px;border-radius:14px 14px 0 0;background:none!important;box-shadow:none;justify-content:space-between;gap:10px;padding:0 14px;font-size:15px;opacity:1}
.arr-list.tight .pk.strip .plip{height:32px;font-size:14px}
.pk.strip.open{transform:translateY(-8px)}
.pk.strip.open .plip,.pk.strip.sel .plip{transform:none}
.pk.strip.new .plip{justify-content:flex-start;color:var(--sec)}
.sl-l{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto}
.sl-r{display:flex;align-items:center;justify-content:flex-end;gap:2px;min-width:0;flex:0 1 auto;font-weight:500;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.sl-r .tx{overflow:hidden;text-overflow:ellipsis}
.sbar{width:3px;height:16px;border-radius:2px;flex:none}
.sghost{border:1.5px dashed var(--w-on);border-radius:999px;padding:1px 9px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sghost.solid{border-style:solid;background:var(--w-chip)}
.pk.strip .pcard{left:auto;right:16px;top:-10px;width:70px;height:40px}
.pk.strip .pcount{position:static;box-shadow:none}

/* ---------- input area: always the same height, so nothing above it moves ---------- */
.input{position:absolute;left:0;right:0;bottom:0;height:var(--inputH)}
.kp{height:100%;background:var(--kb);display:grid;gap:6px;padding:8px 6px calc(var(--home) + 6px);grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,1fr)}
.k{background:var(--key);border-radius:8px;box-shadow:0 1px 0 var(--keysh);font-size:26px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.k.f{background:var(--keyf);font-size:20px}
.k:active,.kl:active{filter:brightness(.85)}
.kb{height:100%;background:var(--kb);display:flex;flex-direction:column}
.krows{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 4px calc(var(--home) + 6px)}
.krow{flex:1;display:flex;gap:6px;justify-content:center}
.krow.last{flex:none;height:44px}
.kl{flex:0 1 34px;min-width:0;background:var(--key);border-radius:6px;box-shadow:0 1px 0 var(--keysh);font-size:22px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.kl.f{background:var(--keyf);font-size:15px;flex:0 0 44px}
.kl.sp{flex:1 1 auto;font-size:15px}
.kl.ret{flex:0 0 96px;background:var(--keyf);font-size:16px}
.kl.ret.go{background:var(--accent);color:var(--on-accent);font-weight:500}
.pn{height:100%;background:var(--panel);padding:14px 16px calc(var(--home) + 6px);overflow:auto}
.cal-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:17px;height:32px}
.cal-h button{width:36px;height:32px;color:var(--accent);font-size:20px}
.cal-h button[disabled]{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;row-gap:1px;margin-top:4px}
.dow{font-size:12px;color:var(--sec);font-weight:600;height:20px}
.day{height:32px;display:flex;align-items:center;justify-content:center;font-size:17px}
.day span{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.day.on span{background:var(--accent);color:var(--on-accent);font-weight:600}
.day.today{color:var(--accent);font-weight:600}
.pn.wpn{padding-top:10px}
.wpn .cal-h{height:26px;font-size:15px}
.wpn .dow{height:16px;font-size:11px}
.wpn .day{height:22px;font-size:15px}
.wpn .day span{width:24px;height:22px;border-radius:11px}
.wseg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;margin-bottom:6px}
.wseg button{flex:1 1 0;min-width:0;height:30px;border-radius:7px;font-size:13px;font-weight:500;white-space:nowrap}
.wseg button[aria-pressed="true"]{background:var(--optcard);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.opts{display:flex;flex-direction:column;background:var(--optcard);border-radius:12px;overflow:hidden}
.opt{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:17px;border-bottom:.5px solid var(--hair);text-align:left}
.opt:last-child{border-bottom:0}
.opt .ck{color:var(--accent);font-weight:600}
.rest{height:100%;padding:24px 24px calc(var(--home) + 20px)}
.rest div{height:100%;border-radius:22px;border:1.5px dashed var(--dash);display:flex;align-items:center;justify-content:center;color:var(--ter);font-size:13px;text-align:center;padding:0 30px}
/* making a category */
.mk{height:100%;background:var(--kb);display:flex;flex-direction:column}
.mkstrip{display:flex;align-items:center;gap:10px;margin:10px 10px 0;background:var(--sheet);border-radius:14px;padding:8px 10px;flex:none}
.mslot{width:40px;height:40px;border-radius:12px;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none}
.mslot.miss{border:2px dashed var(--dash)}
.mslot.pull{border-color:var(--accent);background:var(--accent-soft)}
.mfield{flex:1;height:40px;border-radius:10px;border:2px dashed var(--dash);display:flex;align-items:center;padding:0 12px;font-size:17px;font-weight:500;color:var(--ter);white-space:nowrap;overflow:hidden;--on-caret:var(--accent)}
.mfield.foc{border-color:var(--accent);color:var(--fg);padding-left:10px}
.mfield.pull{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sws{display:flex;gap:8px;padding:10px 14px 4px;align-items:center;flex:none}
.sws button{width:22px;height:22px;border-radius:11px}
.sws button.on{box-shadow:0 0 0 2px var(--kb),0 0 0 4px var(--fg)}
.emo{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;padding:4px 8px calc(var(--home) + 4px);overflow:auto;flex:1}
.emo button{height:40px;font-size:27px;border-radius:8px}
.emo button:active{background:var(--keyf)}
.mk .krows{padding-top:8px}
.fproxy{position:fixed;z-index:60;pointer-events:none}
.fproxy .bc{box-shadow:var(--flysh)}

/* ---------- options column ---------- */
.side{width:340px;flex:none;display:flex;flex-direction:column;gap:14px;font-size:14px;line-height:1.45;max-height:844px;overflow:auto;padding:4px 8px 4px 2px}
.side h1{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.2px;margin:0;text-wrap:balance}
.side p{margin:0;color:var(--sec)}
.sidehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:2px 0}
.sidehead .again{flex:none;white-space:nowrap}
.side details{border-top:.5px solid var(--optline);padding-top:10px}
.side summary{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sec);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;padding:2px 0}
.side summary::-webkit-details-marker{display:none}
.side summary::before{content:'›';display:inline-block;font-size:15px;transition:transform .2s;width:10px}
.side details[open] > summary::before{transform:rotate(90deg)}
.side summary .only{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ter)}
.dsec{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.grp{display:flex;flex-direction:column;gap:6px}
.dim{opacity:.5}
.lbl{font-size:12px;font-weight:600;color:var(--sec);display:flex;align-items:center;gap:8px}
.lbl .tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:999px}
.seg{display:flex;flex-direction:column;gap:6px}
.seg button{text-align:left;padding:8px 12px;border-radius:12px;background:var(--optcard);box-shadow:inset 0 0 0 1px var(--optline)}
.seg button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.seg b{display:block;font-weight:600}
.seg span{color:var(--sec);font-size:13px}
.seg.row2{flex-direction:row;flex-wrap:wrap}
.seg.row2 button{flex:1 1 0;text-align:center;padding:7px 6px;min-width:0}
.seg.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg.grid2 button{padding:7px 10px}
.seg.row2 b,.seg.grid2 b{font-weight:500}
.seg.sm button{padding:4px 0;border-radius:8px;font-size:13px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.prow > span{color:var(--fg)}
.prow .seg{flex:0 0 172px}
.mini{position:relative;flex:none;width:60px;height:38px;border-radius:7px;background:var(--optcard);box-shadow:inset 0 0 0 1.5px var(--optline)}
.mini button{position:absolute;width:18px;height:11px;border-radius:3px;background:var(--fill)}
.mini button[aria-pressed="true"]{background:var(--accent)}
.mini .m-tl{left:4px;top:4px}.mini .m-tr{right:4px;top:4px}.mini .m-c{left:21px;top:13.5px}.mini .m-bl{left:4px;bottom:4px}.mini .m-br{right:4px;bottom:4px}
.rng{display:flex;flex-direction:column;gap:2px}
.rng input{width:100%;accent-color:var(--accent);margin:4px 0 0}
.ticks{position:relative;height:16px;font-size:11px;color:var(--ter);font-variant-numeric:tabular-nums;margin:0 8px}
.ticks span{position:absolute;transform:translateX(-50%)}
.rngv{font-weight:600;color:var(--fg)}
.sw{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.sw input{margin:2px 0 0;width:18px;height:18px;accent-color:var(--accent);flex:none}
.sw span{color:var(--sec)}
.sw b{color:var(--fg);font-weight:500}
.taps{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.taps strong{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.again{padding:8px 14px;border-radius:18px;background:var(--fill);font-weight:500}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.lies{margin:0;padding-left:18px;color:var(--sec)}
.optbtn{display:none}

/* on a phone: the sheet is the screen, options open from a pill at the top */
@media (max-width:640px){
  :root{--home:8px;--sheetTop:52px;--tlTop:8px}
  .app{display:block;height:100%;min-height:0;padding:0}
  .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
  .optbtn{display:block;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;height:32px;padding:0 14px;border-radius:16px;background:var(--card);color:var(--fg);font-size:14px;font-weight:500;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .side{position:fixed;inset:auto 0 0 0;width:auto;max-height:80%;overflow-y:auto;overscroll-behavior:contain;background:var(--page);padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;z-index:10;transform:translateY(102%);transition:transform .35s cubic-bezier(.32,.72,0,1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  .side.open{transform:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  var POS = ['tl','tr','c','bl','br'];
  var POSNAME = {tl:'Top left', tr:'Top right', c:'Middle', bl:'Bottom left', br:'Bottom right'};
  var SIZES = ['S','M','L','XL'];
  var SZ = {amount:{S:34,M:46,L:60,XL:76}, name:{S:15,M:18,L:22,XL:28}, cat:{S:[28,18],M:[38,24],L:[46,30],XL:[60,40]}, when:{S:12,M:14,L:17,XL:20}};
  var PMSZ = {S:56, M:72, L:92, XL:110};
  var PRESETS = {
    wallet:{place:{amount:'bl',name:'tl',cat:'tr',when:'br'}, size:{amount:'M',name:'L',cat:'L',when:'M'}},
    top:{place:{amount:'tl',name:'bl',cat:'br',when:'tr'}, size:{amount:'L',name:'L',cat:'L',when:'S'}},
    playing:{place:{amount:'c',name:'c',cat:'tl',when:'br'}, size:{amount:'XL',name:'M',cat:'M',when:'S'}},
    date:{place:{amount:'c',name:'bl',cat:'tr',when:'tl'}, size:{amount:'XL',name:'M',cat:'M',when:'M'}}
  };
  var OPT = {
    ending:[['P1','P1 · Put it away','No ✓. Once the card has an amount and a name, pockets rise where the keys were, and putting it in one is the save.'],

            ['playing','Playing card','The amount in the middle, the category as its suit'],['date','Date on top','When it goes out heads the card']],

             look:'wallet', pkShows:'peek', pkArr:'grid', picker:'hand', arrive:'fly', marks:'pencil',
             takeGuess:true, pulse:true, grabBack:true, tryDrag:false, theme:'system', sheet:'grouped', float:'off', settle:true};

  }
  setDefaults(false);
  var KEY = 'tilly-card-proto-r8';
  try { // every saved value is checked; anything odd falls back to its default
    var saved = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (saved && typeof saved === 'object') CTL_KEYS.forEach(function(k){
      var v = saved[k];
      if (k === 'preset') { if (v === 'custom' || PRESETS[v]) S[k] = v; }
      else if (OPT[k]) { if (vals(k).indexOf(v) >= 0) S[k] = v; }
      else if (k === 'nCats') { if (typeof v === 'number' && v >= 0 && v <= 24 && v === Math.round(v)) S[k] = v; }

  function remember(){ try { var o = {}; CTL_KEYS.forEach(function(k){ o[k] = S[k]; }); localStorage.setItem(KEY, JSON.stringify(o)); } catch(e) {} }

  // ---------- dates: always from the anchor, through calendar components ----------
  function dim(y, m){ return new Date(y, m+1, 0).getDate(); }
  function addMonths(a, n){ var t = a.y*12 + a.m + n, y = Math.floor(t/12), m = t - y*12; return {y:y, m:m, d:Math.min(a.d, dim(y, m))}; }
  function addDays(a, n){ var dt = new Date(a.y, a.m, a.d + n); return {y:dt.getFullYear(), m:dt.getMonth(), d:dt.getDate()}; }
  function dayNumber(a){ // days since a fixed epoch, from year, month and day alone
    var y = a.y, m = a.m + 1; if (m <= 2) y--;
    var era = Math.floor(y / 400), yoe = y - era * 400, mp = (m + 9) % 12;
    var doy = Math.floor((153 * mp + 2) / 5) + a.d - 1, doe = yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy;
    return era * 146097 + doe;
  }
  function weekday(a){ return (new Date(a.y, a.m, a.d).getDay() + 6) % 7; } // Monday 0
  function cmpDate(a, b){ return (a.y-b.y) || (a.m-b.m) || (a.d-b.d); }
  function dateLabel(){ return MON3[S.date.m] + ' ' + S.date.d + (S.date.y !== TODAY.y ? ' ’' + String(S.date.y).slice(2) : ''); }
  function repeatLabel(){ for (var i=0;i<REPEATS.length;i++) if (REPEATS[i][0]===S.repeat) return REPEATS[i][1]; return ''; }
  function ordinal(n){ var s = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({1:'st',2:'nd',3:'rd'}[n % 10] || 'th'); return n + s; }
  function countdown(){
    var n = dayNumber(S.date) - dayNumber(TODAY);
    if (n === 0) return 'Today';
    if (n === 1) return 'Tomorrow';

    if (n < 0) return (-n) + ' days ago';
    if (n < 21) return 'In ' + n + ' days';
    if (n < 60) return 'In ' + Math.round(n / 7) + ' weeks';

    }

        '<div class="grp"><div class="lbl">Arrives by</div>'+segHtml('segArrive', 'arrive', OPT.arrive, 'row2')+'</div>', '<span class="only" id="p2only">P2 only</span>') +
      sec('secMarks', 'Edit marks', false, segHtml('segMarks', 'marks', OPT.marks, 'row2') + '<p>Dashed means it needs you. A mark means it’s filled in and you can change it: the date, the repeat, and the category once it’s chosen.</p>') +
      sec('secOptions', 'Options', false,
        '<label class="sw" for="optTake"><input type="checkbox" id="optTake"><span><b>✓ takes the guessed category</b><br>Try iCloud, Netflix, Spotify, gym, phone, rent or car insurance.</span></label>' +
        '<label class="sw" for="optPulse"><input type="checkbox" id="optPulse"><span><b>The next part breathes</b><br>A slow pulse on the dashes that want you next.</span></label>' +
        '<label class="sw" for="optGrab" id="swGrab"><input type="checkbox" id="optGrab"><span><b>Grab it back while it closes</b><br>For P1. While the pocket and the sheet close, touching the sheet pulls the card back out. Off, filing saves at once.</span></label>' +
        '<label class="sw" for="optTry" id="swTry"><input type="checkbox" id="optTry"><span><b>Drag to try a pocket</b><br>For P3. Drag to try it on. Nothing is filed until ✓.</span></label>') +
      sec('secTheme', 'Appearance', false, segHtml('segTheme', 'theme', OPT.theme, 'row2')) +
      '<div class="grp"><div class="lbl">Taps for this bill</div><div class="taps"><strong id="tapCount">0</strong><span style="color:var(--sec)">typing not counted</span></div>' +
        '<div class="btns"><button type="button" class="again" id="again">Start again</button></div></div>' +
      sec('secLies', 'What a browser can’t show', false, '<ul class="lies">' + [
        'The real iOS keyboard, its suggestions and its feel. The keyboard here is drawn.',
        'The emoji keyboard. A grid stands in for it.',
        'The repeat wheel. A list stands in for it.',
        'Haptics. The stamp’s thunk and the hand’s ticks are vibration calls, and iPhone Safari ignores them.',
        'iOS’s springs. Flights, the hand and the pockets’ springs are approximations.',
        'Dragging a card into a pocket on a real phone will feel different, especially the magnet and the lip.',
        'Liquid Glass. The glass sheet is a CSS blur; real Liquid Glass refracts and responds to light and motion.',
        'Dynamic Type. The sizes here are fixed points, not text styles.',
        'The float is slow sine waves; on a phone it would sit alongside system motion and might want to respond to tilt.',
        'SF Symbols. The pencil, chevron, calendar, loop and the Calendar tile are drawn stand-ins.',
        'Guessing. Here it’s a short list of words, not a model.',
        'The categories past seven, and their bills, are invented to fill the slider.'
      ].map(function(t){ return '<li>'+t+'</li>'; }).join('') + '</ul>');
    $('side').innerHTML = h;
  }
  function getKey(k){ var p = k.split('.'); return p.length > 1 ? S[p[0]][p[1]] : S[k]; }
  function renderSide(){
    document.querySelectorAll('#side [data-key]').forEach(function(g){
      var v = getKey(g.dataset.key);
      g.querySelectorAll('[data-val]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.val === v)); });
    });
    $('presetCustom').hidden = S.preset !== 'custom';
    $('optCats').value = S.nCats;
    $('optCatsVal').textContent = S.nCats === 0 ? 'First bill' : S.nCats + (S.nCats === 1 ? ' category' : ' categories');
    $('optTake').checked = S.takeGuess; $('optPulse').checked = S.pulse; $('optGrab').checked = S.grabBack; $('optTry').checked = S.tryDrag; $('optSettle').checked = S.settle;
    // dim what doesn't apply to this ending; it can still be set
    $('secP2').querySelector('.dsec').classList.toggle('dim', S.ending !== 'P2'); $('p2only').hidden = S.ending === 'P2';
    $('swGrab').classList.toggle('dim', S.ending !== 'P1');
    $('swTry').classList.toggle('dim', S.ending !== 'P3');
    $('grpCatLabel').classList.toggle('dim', S.ending === 'P1');
    $('tapCount').textContent = S.taps;
  }
  // any control: finish what's moving, keep the draft, show the sheet
  function settleAll(){
    finishFlight(); endSpring(); finishFSpring();
    if (p2T) closeP2();
    settleClosing();
    S.filed = false; S.rising = false; S.anim = null; fan.pan = 0;
    if (S.closing) { S.closing = false; }
    if (!S.open) { freshDraft(); S.justSaved = null; S.open = true; $('sheet').innerHTML = ''; }
  }
  function setControl(key, val){
    var p = key.split('.');
    if (p.length > 1) { S[p[0]] = Object.assign({}, S[p[0]]); S[p[0]][p[1]] = val; S.preset = 'custom'; }
    else if (key === 'preset') { S.preset = val; S.place = copy(PRESETS[val].place); S.size = copy(PRESETS[val].size); }
    else S[key] = val;
    remember();
    if (key === 'theme') { applyTheme(); renderSide(); return; }
    if (key === 'marks') { render(); return; }
    settleAll();
    normalizeFocus();
    render();
  }
  function setCats(n){
    if (n === S.nCats) return;
    settleAll();
    var editName = S.editing ? S.editing.name : null;
    S.nCats = n; remember();
    buildWorld(); // the draft stays: amount, name, date, repeat, a half-made category
    if (S.catId && !catById(S.catId)) S.catId = null;
    if (editName) { S.editing = null; S.rows.forEach(function(r){ if (r.name === editName) S.editing = r; }); }
    if (S.focus === 'cat' && !S.cats.length && S.ending !== 'P2') S.focus = null;
    normalizeFocus();
    render();
  }
  buildSide();
  $('side').addEventListener('click', function(ev){
    var b = ev.target.closest('[data-val]'), g = b && b.closest('[data-key]');
    if (!g) return;
    setControl(g.dataset.key, b.dataset.val);
  });
  $('optCats').addEventListener('input', function(ev){ setCats(+ev.target.value); });
  $('optTake').addEventListener('change', function(ev){ S.takeGuess = ev.target.checked; remember(); render(); });
  $('optPulse').addEventListener('change', function(ev){ S.pulse = ev.target.checked; remember(); render(); });
  $('optSettle').addEventListener('change', function(ev){ S.settle = ev.target.checked; remember(); ensureFloat(); });
  $('optGrab').addEventListener('change', function(ev){ S.grabBack = ev.target.checked; remember(); });
  $('optTry').addEventListener('change', function(ev){ S.tryDrag = ev.target.checked; remember(); });
  $('again').addEventListener('click', function(){ settleAll(); buildWorld(); freshDraft(); S.open = true; $('sheet').innerHTML = ''; render(); });
  $('resetCtl').addEventListener('click', function(){ settleAll(); var n = S.nCats; setDefaults(true); remember(); if (S.nCats !== n) { buildWorld(); if (S.catId && !catById(S.catId)) S.catId = null; } normalizeFocus(); render(); });
  $('optbtn').addEventListener('click', function(){ $('side').classList.toggle('open'); });
  document.addEventListener('click', function(ev){
    var side = $('side');
    if (side.classList.contains('open') && !side.contains(ev.target) && ev.target.id !== 'optbtn') side.classList.remove('open');
  });

  // a hook for testing in the console: tillyProto.state(), then tillyProto.render() after changing it
  window.tillyProto = {state:function(){ return S; }, render:render, float:function(){ return FL; }};

  applyTheme();
  S.open = true;
  render();
})();
</script>
