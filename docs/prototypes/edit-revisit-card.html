<title>Tilly Card Prototype</title>
<!--
  Tilly · adding an expense, two endings mixed and matched · 2026-10-07

  Built during tilly-explore after prototype v7 (thirteen fixed variants, in git history at 24a81b0) and canvas
  rounds 3–7 (https://claude.ai/artifact/A8CUNvsPrYMjek5S2a64Rm). v8 turned the card, the pockets and the
  picker into controls that combine; v9 added the sheet, the spread and the float. This round drops what Jake
  ruled out (the P1 ending; pockets that show a count, stacked edges or a folder; pockets in one row; the icons
  and list pickers) and adds a Look switch: today's iOS look, or Tilly, Drawn, from
  docs/prototypes/icons-in-app.html, with the category drawn in direction I, L or G.

  Questions it explores:
    1. Which ending: play a category onto the card, then ✓ (P2), or pick a pocket, then ✓ (P3)? They're tied.
       P2 has the stamp of applying a category; P3 makes the pockets themselves the picker.
    2. Does the card hold up in Tilly, Drawn: wash colour, paper, rounded type and a drawn category?
    3. Which drawn category (I, L or G) reads at card size, in the hand and in a pocket?
    4. In Drawn, is the sheet one white piece or glass, and does a float that keeps an unfinished card moving
       earn its place?
    5. Still open from v9, now with 0 to 24 categories: where each part sits and how big it is; how the date and
       repeat read; whether a pocket shows its bills peeking or its monthly total, in a grid, a dense grid or a
       list; whether P2 offers categories as a hand, a spread or the pockets.

  Settled so far: the card is the input. Dashed means a part needs you; a pencil means it's filled in and yours
  to change. The card shows its category, colour included, before ✓ saves. The amount starts top left and the
  category reads last, bottom right, as its emoji. The Wallet card is the style.

  Every value the Drawn look uses is a named --drawn token in one :root block, as a seed for the design system
  pass.

  Direction chosen 2026-10-16: P3, the Start top left layout at sizes L, L, L and S, the Wallet card, the
  category as its emoji, date and repeat on two lines, pockets with bills peeking in a grid, a white sheet
  with no float. Built first in the iOS look; Tilly, Drawn is its own piece of work. See
  docs/briefs/edit-revisit/brief.md (2026-10-16) and docs/plans/edit-revisit.md.

  Retained as a record of the work rather than as a spec. Where this disagrees with the docs, the docs win.
-->

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,summary:focus-visible,input:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{min-height:100%;display:flex;gap:48px;align-items:center;justify-content:center;padding:32px 24px}
.phone{position:relative;flex:none;width:390px;height:844px;border-radius:54px;overflow:hidden;background:var(--paper);box-shadow:0 0 0 11px var(--bezel),0 30px 70px rgba(0,0,0,.28)}

/* timeline behind the sheet */
.tl{position:absolute;inset:0;padding:var(--tlTop) 0 24px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.tl::-webkit-scrollbar{display:none}
.tlhead{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 12px}
.month{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.3px}
.fig{font-size:15px;color:var(--sec);margin-top:2px;font-variant-numeric:tabular-nums}
.plus{width:44px;height:44px;border-radius:22px;background:var(--fill);display:flex;align-items:center;justify-content:center}
.rows{display:flex;flex-direction:column;padding:0 20px}
.row{display:flex;align-items:center;gap:12px;height:62px;border-radius:14px;transition:background .8s;cursor:pointer}
.row.new{background:var(--accent-soft)}
.well{width:40px;height:40px;border-radius:20px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.rtext{flex:1;min-width:0}
.rname{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdate{font-size:13px;color:var(--sec);margin-top:2px}
.ramt{font-size:17px;font-variant-numeric:tabular-nums}
.row.up .rname,.row.up .ramt{color:var(--sec)}
.empty{padding:120px 40px 0;text-align:center;color:var(--sec);font-size:17px;line-height:1.4}

/* the sheet */
.scrim{position:absolute;inset:0;background:var(--scrim);transition:opacity .35s}
.scrim.off{opacity:0;pointer-events:none}
.sheet{position:absolute;left:0;right:0;top:var(--sheetTop);bottom:0;background:var(--sheet);border-radius:38px 38px 0 0;overflow:hidden;transition:transform .42s cubic-bezier(.32,.72,0,1)}
.sheet.off{transform:translateY(105%)}
/* how the sheet sits: each mode only swaps tokens, so every surface inside follows */
.sheet{--notch:var(--sheet)}
.scrim.thin{background:var(--scrim-thin)}
.sheet.sh-white{--sheet:var(--sheet-white);--panel:transparent;--kb:transparent;--key:var(--key-quiet);--keyf:var(--keyf-quiet);--keysh:transparent;--optcard:var(--group-white)}
.sheet.sh-glass{background:color-mix(in srgb,var(--sheet) 32%,transparent);-webkit-backdrop-filter:blur(8px) saturate(170%);backdrop-filter:blur(8px) saturate(170%);--panel:transparent;--kb:transparent;--key:color-mix(in srgb,var(--keybase) 62%,transparent);--keyf:color-mix(in srgb,var(--keyfbase) 50%,transparent);--optcard:color-mix(in srgb,var(--keybase) 70%,transparent);--notch:transparent}
.sheet.sh-none{background:transparent;--panel:transparent;--kb:transparent;--notch:transparent}
.bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0;z-index:3}
.circ{width:44px;height:44px;border-radius:22px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--fg);transition:background .15s,opacity .15s}
.circ.ok{background:var(--accent);color:var(--on-accent)}
.circ[aria-disabled="true"]{opacity:.45}
.caret{display:inline-block;flex:none;width:max(2px,.055em);height:.82em;background:var(--on-caret,var(--accent));margin-left:.04em;border-radius:2px;animation:blink 1.06s steps(1) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.noPulse .pulse{animation:none}
.pend{opacity:0}

/* ---------- the bill card: five slots, four parts, seven looks ---------- */
.hb{position:absolute;left:22px;right:22px;top:76px}
.hb.idx{top:104px}
.gr{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 72%,var(--mixlight)) 0%,var(--c) 50%,color-mix(in srgb,var(--c) 76%,var(--mixdark)) 100%)}
.bc{position:relative;width:100%;aspect-ratio:1.586;border-radius:20px;display:flex;flex-direction:column;padding:16px 18px;container-type:inline-size;color:var(--on);background:var(--card);box-shadow:var(--cardsh);text-align:left;
  --on:var(--fg); --on-soft:var(--ter); --on-dash:var(--dash); --on-chip:var(--fill); --on-caret:var(--accent); --on-mark:var(--sec);
  --on-tile:color-mix(in srgb,var(--c) 22%,transparent)}
.bc.none{--on-tile:transparent}
.bc.faint{filter:saturate(.6)}
.bc > .r-top,.bc > .r-mid,.bc > .r-bot{position:relative;z-index:1}
.r-top,.r-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px}
.r-top{align-items:flex-start}
.r-bot{align-items:flex-end}
.r-mid{flex:1 0 auto;display:flex;align-items:center;justify-content:center;padding:4px 0}
.sl{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%;color:var(--on)}
.sl.l{align-items:flex-start;flex:0 1 auto}
.sl.r{align-items:flex-end;margin-left:auto;flex:0 1 auto;text-align:right}
.sl.c{align-items:center;text-align:center}
.pt{max-width:100%;min-width:0;border-radius:8px}
.white{--on:var(--w-on);--on-soft:var(--w-soft);--on-dash:var(--w-dash);--on-chip:var(--w-chip);--on-caret:var(--w-on);--on-mark:var(--w-soft);--on-tile:transparent}
/* parts */
.p-amt{display:flex;align-items:center;font-family:var(--display);font-weight:700;letter-spacing:-.026em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:min(var(--fs),calc(100cqi / (var(--n) * .62)))}
.p-amt.zero{color:var(--on-soft)}
.p-name{display:flex;align-items:center;font-size:var(--fs);font-weight:600;letter-spacing:-.01em;line-height:1.3;white-space:nowrap}
.nmv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fld{display:inline-flex;align-items:center;height:1.75em;padding:0 .55em;border:2px dashed var(--on-dash);border-radius:.42em;font-size:.9em;color:var(--on-soft);white-space:nowrap}
.fld.foc{border-style:solid;border-color:var(--on-caret);padding-left:.45em}
.p-cat{display:flex;align-items:center;gap:8px}
.sl.r .p-cat{flex-direction:row-reverse}
.tile{position:relative;flex:none;width:var(--ts);height:var(--ts);border-radius:calc(var(--ts) * .28);font-size:var(--es);line-height:1;display:flex;align-items:center;justify-content:center;background:var(--on-tile)}
.tile.dash{background:none;border:2px dashed var(--on-dash)}
.tile.foc{box-shadow:0 0 0 2.5px var(--on-caret)}
.clbl{font-size:var(--fs);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.clbl.soft{color:var(--on-soft)}
.wspk{position:absolute;right:-7px;top:-7px;width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
.wspk svg{width:11px;height:11px}
.p-when{display:flex;flex-direction:column;gap:2px;font-size:var(--fs);font-weight:600;line-height:1.3;max-width:100%;min-width:0}
.sl.l .p-when{align-items:flex-start}
.sl.r .p-when{align-items:flex-end}
.sl.c .p-when{align-items:center}
.p-when.one{flex-direction:row;align-items:center;gap:.3em}
.p-when.tilew{flex-direction:row;align-items:center;gap:.6em}
.sl.r .p-when.tilew{flex-direction:row-reverse}
.sl.c .p-when.tilew{flex-direction:column;gap:.3em}
.p-when.chips{flex-direction:row;flex-wrap:wrap;gap:.35em}
.sl.r .p-when.chips{justify-content:flex-end}
.sl.c .p-when.chips{justify-content:center}
.wb{display:inline-flex;align-items:center;max-width:100%;min-width:0;border-radius:6px;white-space:nowrap}
.wb.foc{box-shadow:0 0 0 2px var(--on-caret)}
.wb.soft{color:var(--on-soft);font-weight:500}
.wsep{opacity:.6}
.wchip{background:var(--on-chip);border-radius:999px;padding:.28em .7em;gap:.35em}
.wchip svg{width:1em;height:1em;flex:none}
.sent .tx{white-space:normal;text-wrap:balance}
.ctile{position:relative;flex:none;width:var(--t);height:var(--t);border-radius:calc(var(--t) * .23);background:var(--caltile);box-shadow:var(--caltilesh);display:flex;flex-direction:column;overflow:hidden;line-height:1}
.ctile .ctop{height:31%;background:var(--calred);color:var(--w-on);font-size:calc(var(--t) * .2);font-weight:700;letter-spacing:.04em;font-variant-caps:all-small-caps;display:flex;align-items:center;justify-content:center}
.ctile .cday{flex:1;display:flex;align-items:center;justify-content:center;font-size:calc(var(--t) * .46);font-weight:500;color:var(--caltile-fg);font-variant-numeric:tabular-nums}
.ctb{position:relative;flex:none;border-radius:calc(var(--t) * .23)}
.pmb{position:relative;flex:none;border-radius:50%}
.pmb svg{display:block}
/* edit marks: dashed means it needs you; a mark means it's filled in and you can change it */
.edv{display:inline-flex;align-items:center;min-width:0;max-width:100%}
.tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.emk{display:inline-flex;align-items:center;margin-left:.3em;color:var(--on-mark);flex:none}
.emk svg{width:.85em;height:.85em;display:block}
.emk svg.chev{width:.55em;height:.78em}
.epill{background:var(--on-chip);padding:.25em .6em;border-radius:999px}
.ebadge{position:absolute;width:16px;height:16px;border-radius:8px;background:var(--card);color:var(--sec);box-shadow:var(--ebsh);display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
.ebadge svg{display:block;width:10px;height:10px}
.ebadge svg.chev{width:7px;height:10px}
.ebadge.br{right:-5px;bottom:-5px}
.ebadge.trc{right:4%;top:4%}
.ering{box-shadow:0 0 0 2px var(--on-chip)}

/* looks: each colours only its .cc elements, so a change of colour can crossfade or flood just those */
.cc{pointer-events:none}
.lk-wallet{box-shadow:var(--wcardsh);background:transparent;--on:var(--w-on);--on-soft:var(--w-soft);--on-dash:var(--w-dash);--on-chip:var(--w-chip);--on-caret:var(--w-on);--on-mark:var(--w-soft);--on-tile:transparent}
.cc.fill{position:absolute;inset:0;border-radius:inherit}
.cc.fill.none{background:linear-gradient(135deg,var(--neutral1),var(--neutral2))}
.lk-edge{padding-left:28px}
.cc.edge{position:absolute;left:0;top:0;bottom:0;width:8px;border-radius:20px 0 0 20px;background:var(--c)}
.cc.edge.none{background:none;left:9px;top:18px;bottom:18px;width:0;border-left:2px dashed var(--dash);border-radius:0}
.lk-band .r-top{margin-bottom:14px}
.cc.band{position:absolute;left:-18px;right:-18px;top:-16px;bottom:-12px;min-height:28px;border-radius:20px 20px 0 0}
.cc.band.none{background:linear-gradient(135deg,var(--neutral1),var(--neutral2))}
.lk-band .r-top > .sl{position:relative;z-index:1}
.lk-tint{--on-dash:color-mix(in srgb,var(--c) 55%,transparent);--on-soft:color-mix(in srgb,var(--c) 45%,var(--ter));--on-chip:color-mix(in srgb,var(--c) 18%,transparent);--on-caret:color-mix(in srgb,var(--c) 80%,var(--fg))}
.lk-tint.none{--on-dash:var(--dash);--on-soft:var(--ter);--on-chip:var(--fill);--on-caret:var(--accent)}
.cc.tintbg{position:absolute;inset:0;border-radius:inherit;background:color-mix(in srgb,var(--c) 16%,var(--card));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 38%,transparent)}
.cc.tintbg.none{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--dash)}
.lk-index{border-radius:6px;background-color:var(--index);background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--bluerule) 27px 28px);padding:14px 18px}
.lk-index .r-top{padding-bottom:10px;margin-bottom:6px}
.lk-index .r-top::after{content:'';position:absolute;left:-18px;right:-18px;bottom:0;height:2px;background:var(--redrule)}
.cc.tab{position:absolute;left:18px;top:-19px;width:78px;height:20px;border-radius:8px 8px 0 0}
.cc.tab.none{background:none;border:2px dashed var(--dash);border-bottom:0}
.lk-playing{border-radius:14px;background:var(--hcard);padding:16px 40px}
.pip{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:16px;line-height:1;pointer-events:none;z-index:1}
.pip.pip-tl{left:11px;top:12px}
.pip.pip-br{right:11px;bottom:12px;transform:rotate(180deg)}
.dotw{position:relative;width:5px;height:5px}
.cc.dot{position:absolute;inset:0;border-radius:50%;background:var(--c)}
.cc.dot.none{background:none}
.pdash{width:18px;height:18px;border-radius:9px;border:2px dashed var(--dash)}
.lk-ticket .r-bot{margin-top:16px}
.cc.stub{position:absolute;left:-18px;right:-18px;top:-12px;bottom:-16px;min-height:28px;border-radius:0 0 20px 20px}
.cc.stub.none{background:linear-gradient(135deg,var(--neutral1),var(--neutral2))}
.perf{position:absolute;left:-8px;right:-8px;top:-13px;border-top:2px dashed var(--card);pointer-events:none}
.notch{position:absolute;top:-20px;width:8px;height:16px;background:var(--notch,var(--sheet));pointer-events:none}
.notch.l{left:-18px;border-radius:0 8px 8px 0}
.notch.r{right:-18px;border-radius:8px 0 0 8px}
.lk-ticket .r-bot > .sl{position:relative;z-index:1}
.fghost{display:block;width:100%;border:2px dashed var(--dash);border-radius:20px}

/* ---------- the hand ---------- */
.hand{position:relative;height:100%;background:var(--panel);touch-action:none;-webkit-user-select:none;user-select:none;overflow:visible}
.hc{position:absolute;left:50%;top:40px;width:84px;height:120px;margin-left:-42px;border-radius:10px;background:var(--hcard);box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 6px 14px rgba(0,0,0,.16);transition:transform .3s cubic-bezier(.32,.72,0,1);overflow:hidden;cursor:grab;color:var(--fg)}
.hc::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c)}
.hc.g{box-shadow:0 0 0 2.5px var(--accent),0 12px 22px rgba(0,0,0,.22)}
.hpip{position:absolute;left:6px;top:5px;font-size:13px;line-height:1;display:flex;align-items:center;gap:1px;color:var(--accent)}
.hbig{position:absolute;left:0;right:0;top:33px;text-align:center;font-size:38px;line-height:1}
.hname{position:absolute;left:4px;right:4px;bottom:11px;text-align:center;font-size:11px;font-weight:600;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdash{position:absolute;left:50%;top:36px;width:42px;height:42px;margin-left:-21px;border-radius:21px;border:2px dashed var(--c)}
.hc.hnew{background:var(--panel);box-shadow:inset 0 0 0 2px var(--ter);color:var(--sec)}
.hc.hnew::after{display:none}
.hc.hnew .hbig{font-size:30px;top:38px;font-weight:300}
.hflyer{position:fixed;z-index:50;pointer-events:none}
/* P2: the spread, a loose row of cards that runs off the right edge */
.spr{position:relative;height:100%;background:var(--panel);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain;-webkit-user-select:none;user-select:none}
.spr::-webkit-scrollbar{display:none}
.sprin{position:relative;height:100%}
.hc.spc{left:var(--x);top:66px;width:96px;height:132px;margin-left:0;transform:translateY(var(--dy)) rotate(var(--rot));transition:transform .18s cubic-bezier(.32,.72,0,1);touch-action:pan-x}
.hc.spc.prs{transform:translateY(calc(var(--dy) - 8px)) rotate(0deg) scale(1.04)}
.spc .hbig{top:40px;font-size:44px}
.spc .hdash{top:42px;width:46px;height:46px;margin-left:-23px}
.spc .hname{font-size:12px;bottom:12px}
.hc.hnew.spc .hbig{top:44px}
.spflyer{z-index:55}
/* the card floats in a wrapper, so press feedback and flights never fight the float */
.flt{position:relative;transform-origin:50% 50%}
.flt.fl .lk-wallet{box-shadow:0 calc(13px + 3px * var(--fl,0)) calc(28px + 4px * var(--fl,0)) var(--wdrop)}
.flt.fl .bc:not(.lk-wallet){box-shadow:var(--ring),0 calc(8px + 3px * var(--fl,0)) calc(24px + 6px * var(--fl,0)) var(--drop)}
.hflyer > *{position:absolute!important;left:0!important;top:0!important;margin:0!important;width:100%!important;height:100%!important;transform:none!important;transition:none!important}


/* ---------- pockets ---------- */
.pkts{height:100%;background:var(--panel);display:flex;flex-direction:column;--pkw:108px;--pkh:86px;--liph:46px;--lipfs:13px;--toph:34px;--topfs:11px}
.pkts.arr-dense{--pkw:80px;--pkh:66px;--liph:34px;--lipfs:11px;--toph:26px;--topfs:10px}
.pkscroll{flex:1;min-height:0;overflow-y:auto;padding:20px 12px calc(var(--home) + 14px);touch-action:pan-y;scrollbar-width:none;overscroll-behavior:contain}
.pkscroll::-webkit-scrollbar{display:none}
.pkts.static{pointer-events:none}
.pkts.enter .pk{animation:pkIn .3s cubic-bezier(.32,.72,0,1) both;animation-delay:calc(var(--i) * 30ms)}
.pk.fresh{animation:pkFresh .24s ease-out both}
.pkts.enter .pk.new.pulse{animation:pkIn .3s cubic-bezier(.32,.72,0,1) both,pulse 1.8s ease-in-out .3s infinite}
.noPulse .pkts.enter .pk.new.pulse{animation:pkIn .3s cubic-bezier(.32,.72,0,1) both}
.pkts .pk.tgt{animation:none}
@keyframes pkIn{from{opacity:0;translate:0 26px}to{opacity:1;translate:0 0}}
@keyframes pkFresh{from{opacity:0;scale:.9}to{opacity:1;scale:1}}
.pkgrid{display:grid;grid-template-columns:repeat(3,var(--pkw));justify-content:center;gap:22px 14px;padding-top:4px}
.arr-dense .pkgrid{grid-template-columns:repeat(4,var(--pkw));gap:18px 10px}
.pk{position:relative;width:var(--pkw);height:var(--pkh);transition:transform .25s cubic-bezier(.32,.72,0,1),opacity .2s;cursor:pointer}
.pk.g,.pk.has,.pk.sel{transform:translateY(-6px)}
.pk.sel .pback{box-shadow:0 0 0 2.5px var(--accent)}
.pk.sel .plip{transform:translateY(5px)}
.pkts.dragging .pk:not(.open){opacity:.55}
.pback{position:absolute;inset:0;border-radius:12px;background:color-mix(in srgb,var(--c) 35%,transparent);transition:transform .2s cubic-bezier(.32,.72,0,1)}
.pk.g .pback{box-shadow:0 0 0 2.5px var(--accent)}
.ptop,.pghost{position:absolute;left:10px;right:10px;height:var(--toph);border-radius:6px;font-size:var(--topfs);line-height:1.1;font-weight:600;padding:2px 7px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop{background:var(--ptop);color:var(--ptop-fg);box-shadow:0 -1px 3px rgba(0,0,0,.14)}
.pghost{background:color-mix(in srgb,var(--ptop) 70%,transparent);color:var(--ptop-fg);box-shadow:0 -1px 3px rgba(0,0,0,.12)}
.pghost.dashed{background:color-mix(in srgb,var(--ptop) 30%,transparent);border:1.5px dashed var(--ptop);box-shadow:none;padding-top:1px}
.pcard{position:absolute;left:6px;right:6px;top:calc(var(--pkh) - var(--liph) - 10px);height:calc(var(--liph) + 15px);border-radius:7px;color:var(--w-on);padding:5px 7px;display:flex;flex-direction:column;gap:1px;font-size:11px;font-weight:700;line-height:13px;box-shadow:0 -2px 6px rgba(0,0,0,.2);touch-action:none;cursor:grab;overflow:hidden}
.pcard span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.plip{position:absolute;left:0;right:0;bottom:0;height:var(--liph);border-radius:10px 10px 12px 12px;opacity:.95;color:var(--w-on);font-size:var(--lipfs);font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px;white-space:nowrap;transition:transform .2s cubic-bezier(.32,.72,0,1);box-shadow:0 -2px 6px var(--pkshade)}
.plip .lnm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.plip .lspk{display:flex;flex:none}
.plip > span:not(.lnm):not(.sl-l):not(.sl-r){flex:none}
.pk.open .plip{transform:translateY(10px)}
.pk.open .pback{transform:translateY(-3px)}
.pk.new .pback{background:transparent;border:2px dashed var(--ter)}
.pk.new .plip{background:transparent;color:var(--sec);box-shadow:none;opacity:1}
.pk.new.pull .pback{border-color:var(--accent);background:var(--accent-soft)}
.pk.new.pull .plip{color:var(--accent)}
/* what a pocket shows */
.ptot{position:absolute;left:4px;right:4px;top:7px;text-align:center;font-size:12px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arr-dense .ptot{font-size:10px;top:5px}
/* list arrangement: Wallet-style strips */
.arr-list .pkscroll{padding:16px 14px calc(var(--home) + 14px)}
.arr-list .pkgrid{display:flex;flex-direction:column;gap:0;padding-top:6px}
.pk.strip{width:auto;height:72px;margin-top:-28px}
.pk.strip:first-child{margin-top:0}
.arr-list.tight .pk.strip{height:60px}
.pk.strip .pback{background:var(--c);border-radius:14px;box-shadow:0 -2px 8px var(--pkshade)}
.pk.strip .pback.gr{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 72%,var(--mixlight)) 0%,var(--c) 50%,color-mix(in srgb,var(--c) 76%,var(--mixdark)) 100%)}
.pk.strip .plip{top:0;bottom:auto;height:44px;border-radius:14px 14px 0 0;background:none!important;box-shadow:none;justify-content:space-between;gap:10px;padding:0 14px;font-size:15px;opacity:1}
.arr-list.tight .pk.strip .plip{height:32px;font-size:14px}
.pk.strip.open{transform:translateY(-8px)}
.pk.strip.open .plip,.pk.strip.sel .plip{transform:none}
.pk.strip.new .plip{justify-content:flex-start;color:var(--sec)}
.sl-l{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto}
.sl-r{display:flex;align-items:center;justify-content:flex-end;gap:2px;min-width:0;flex:0 1 auto;font-weight:500;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.sl-r .tx{overflow:hidden;text-overflow:ellipsis}
.sghost{border:1.5px dashed var(--w-on);border-radius:999px;padding:1px 9px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sghost.solid{border-style:solid;background:var(--w-chip)}
.pk.strip .pcard{left:auto;right:16px;top:-10px;width:70px;height:40px}

/* ---------- input area: always the same height, so nothing above it moves ---------- */
.input{position:absolute;left:0;right:0;bottom:0;height:var(--inputH)}
.kp{height:100%;background:var(--kb);display:grid;gap:6px;padding:8px 6px calc(var(--home) + 6px);grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,1fr)}
.k{background:var(--key);border-radius:8px;box-shadow:0 1px 0 var(--keysh);font-size:26px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.k.f{background:var(--keyf);font-size:20px}
.k:active,.kl:active{filter:brightness(.85)}

  if (DMQ && DMQ.addEventListener) DMQ.addEventListener('change', function(){ if (S.theme === 'system') redrawQuiet(); });
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', function(){ paintWashes($('phone')); }); // type loading can change a part's height
