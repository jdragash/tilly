<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><title>All bills</title>

<!--
  Tilly — All bills as folders. 2026-10-17.
  Question: if the hand becomes the category picker, can the folders live on as the All bills sheet?
  A folder per category with its bills stacked inside as cards showing their amounts, the folder's total
  on it, and the sheet's total above. Three directions you tap between, with A/B/C setups.
  Built in the language of entry-ux/card-polish.html and card-landing.html. Direction: pending.
  The Drawn look is the card prototype's (docs/prototypes/edit-revisit-card.html), its wash, grain, glyphs and
  --drawn values copied from there.

  Retained as a record of the work rather than as a spec. Where this disagrees with the docs, the docs win.
-->
<style>
/* Layout: one phone, the All bills sheet over a dimmed timeline; the controls sit beside it, or in a drawer on a phone. */
:root{
  --page:#E5E5EA; --sheet:#FFFFFF; --ground:#F2F2F7; --fg:#000000; --sec:#6C6C70; --hair:rgba(0,0,0,.14);
  --btn:#F2F2F7; --accent:#2A78D6; --panel:#FFFFFF; --ctl:#F2F2F7; --rowbar:#E3E3E8;
  --plain:#FFFFFF; --plainfg:#1C1C1E; --plainsec:#6C6C70; --seg:#E5E5EA; --segon:#FFFFFF;
  --paper:#EFEEEA; --paperDeep:#E4E2DC; --paperCard:#F7F6F2; --ink:#1C1B19; --ink2:#8A8883;
  --drawnFont:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not(.light){
  --page:#111113; --sheet:#1C1C1E; --ground:#000000; --fg:#FFFFFF; --sec:#98989F; --hair:rgba(255,255,255,.2);
  --btn:#2C2C2E; --accent:#0A84FF; --panel:#1C1C1E; --ctl:#2C2C2E; --rowbar:#1C1C1E;
  --plain:#2C2C2E; --plainfg:#FFFFFF; --plainsec:#98989F; --seg:#2C2C2E; --segon:#636366;
  --paper:#1D1C1A; --paperDeep:#161513; --paperCard:#2B2A27; --ink:#F2F1EE; --ink2:#8D8B86; color-scheme:dark } }
:root[data-theme="dark"],html.dark{
  --page:#111113; --sheet:#1C1C1E; --ground:#000000; --fg:#FFFFFF; --sec:#98989F; --hair:rgba(255,255,255,.2);
  --btn:#2C2C2E; --accent:#0A84FF; --panel:#1C1C1E; --ctl:#2C2C2E; --rowbar:#1C1C1E;
  --plain:#2C2C2E; --plainfg:#FFFFFF; --plainsec:#98989F; --seg:#2C2C2E; --segon:#636366;
  --paper:#1D1C1A; --paperDeep:#161513; --paperCard:#2B2A27; --ink:#F2F1EE; --ink2:#8D8B86; color-scheme:dark }
html.light{
  --page:#E5E5EA; --sheet:#FFFFFF; --ground:#F2F2F7; --fg:#000000; --sec:#6C6C70; --hair:rgba(0,0,0,.14);
  --btn:#F2F2F7; --accent:#2A78D6; --panel:#FFFFFF; --ctl:#F2F2F7; --rowbar:#E3E3E8;
  --plain:#FFFFFF; --plainfg:#1C1C1E; --plainsec:#6C6C70; --seg:#E5E5EA; --segon:#FFFFFF;
  --paper:#EFEEEA; --paperDeep:#E4E2DC; --paperCard:#F7F6F2; --ink:#1C1B19; --ink2:#8A8883;
  --drawnFont:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,"Helvetica Neue",sans-serif; color-scheme:light }

html,body{margin:0;height:100%;overflow:hidden;background:var(--page);color:var(--fg);

.ic{position:relative;display:block;width:100%;height:100%}
.ic>img.u{position:absolute;left:-6.5%;top:-6.5%;width:113%;height:113%;max-width:none}
.ic>.boil{position:absolute;inset:var(--gi,14%)}
.boil>img{position:absolute;left:-8.33%;top:-8.33%;width:116.7%;height:116.7%;max-width:none;opacity:0;animation:boil .375s steps(1,end) infinite}
.boil>img:nth-child(2){animation-delay:-.125s} .boil>img:nth-child(3){animation-delay:-.25s}

<script>
/* =====================================================================================================
   STATE
   ===================================================================================================== */
const mq=matchMedia("(prefers-color-scheme: dark)");
const DEF={look:"ios", drawDir:"I", gpack:"cols", dir:"rows", show:"some", peek:3, rgap:"tight", across:2, gpeek:2, fanN:4, spread:"normal", tilt:5,
  color:"cards", tone:"cream", total:"lip", order:"cost", face:"pass", figure:"period",
  inside:"stack", folder:"waits", bounce:.15, dur:.5, stagger:.03, period:"m", dark:mq.matches, slow:1,

const SKEYS=Object.keys(DEF).filter(k=>k!=="dark"&&k!=="slow"&&k!=="period");
let S=Object.assign({},DEF);
try{ const v=JSON.parse(localStorage.getItem("tilly-allbills-folders")||"null"); if(v) Object.assign(S,v); }catch(e){}

/* =====================================================================================================
   MOTION — springs by duration and bounce, as SwiftUI's .spring(duration:bounce:)
   ===================================================================================================== */
const PROPS=["x","y","w","h","r","op","cb","sc"];
class N{
  constructor(el,kind){ this.el=el; this.kind=kind; this.s={x:0,y:0,w:0,h:0,r:0,op:1,cb:-40,sc:1}; this.v={}; this.t={}; this.render(); }
  render(){ const s=this.s, st=this.el.style;
    st.transform=`translate(${s.x}px,${s.y}px) rotate(${s.r}deg) scale(${s.sc})`;

}
const A=(()=>{
  const live=new Set(); let clock=0,last=0,running=false,timers=[];
  function kick(){ if(!running){ running=true; last=performance.now(); requestAnimationFrame(frame); } }
  function frame(now){
    const dt=Math.min((now-last)/1000,.05)*S.slow; last=now; clock+=dt;
    for(const n of [...live]){
      let any=false;
      for(const p in n.t){ const t=n.t[p];
        const steps=Math.max(1,Math.ceil(dt*240)), h=dt/steps;
        for(let i=0;i<steps;i++){ const a=-t.k*(n.s[p]-t.to)-t.c*(n.v[p]||0); n.v[p]=(n.v[p]||0)+a*h; n.s[p]+=n.v[p]*h; }
        const range=Math.max(1,Math.abs(t.span));
        if(Math.abs(n.s[p]-t.to)<.0015*range&&Math.abs(n.v[p])<.02*range){ n.s[p]=t.to; n.v[p]=0; delete n.t[p]; } else any=true;
      }
      n.render(); if(!any) live.delete(n);
    }
    if(timers.length){ const due=timers.filter(x=>x.t<=clock); timers=timers.filter(x=>x.t>clock); due.forEach(x=>{ if(!x.dead) x.fn(); }); }
    if(live.size||timers.length) requestAnimationFrame(frame); else running=false;
  }
  function to(n,tgt,o){ o=o||{};
    const run=()=>{
      const d=Math.max(.05,o.dur!=null?o.dur:S.dur), b=o.bounce!=null?o.bounce:S.bounce;
      for(const p in tgt){

/* =====================================================================================================
   LAYOUT — where everything sits closed (folders) and open (one folder's cards)
   ===================================================================================================== */
const HEAD=96, GAP=16, LIP=56, clamp=(a,v,b)=>Math.max(a,Math.min(b,v));
const padOf=w=>clamp(7,.045*w,16);
function stripH(w){ return S.face==="pass" ? clamp(11,.048*w,17)*1.25+padOf(w)+3 : clamp(13,.13*w,44)*1.08+padOf(w)+3; }
const IW=()=>sheet.clientWidth-32;

const nShown=(f,peek)=>S.show==="all"?f.bills.length:Math.min(peek,f.bills.length);
function closedLayout(){
  const L=new Map(), iw=IW(), tabH=S.total==="tab"?22:0; let y=HEAD;
  const order=folderOrder();
  if(S.dir==="grid"){
    const cols=S.across, cg=12, fw=(iw-cg*(cols-1))/cols, cw=fw-16, ch=cw/1.586, s=stripH(cw)+1, lipH=cols===2?58:52;
    if(S.gpack==="cols"){ // each folder goes to the shorter column, so folders of any height pack without gaps
      const colY=Array(cols).fill(y);
      order.forEach(f=>{
        const c=colY.indexOf(Math.min(...colY)), fx=16+c*(fw+cg), top=colY[c]+tabH, bills=sorted(f), n=nShown(f,S.gpeek), lipTop=top+10+n*s;
        bills.forEach((b,k)=>{ const kk=Math.min(k,n-1), cy=top+10+kk*s, vis=lipTop+14-cy;
          L.set(b.n,{x:fx+8,y:cy,w:cw,h:ch,r:0,op:k<n?1:0,cb:ch-vis,sc:1,z:2+k}); });
        L.set(f.back,{x:fx,y:top,w:fw,h:lipTop+lipH-top,op:1,r:0,sc:1,z:1});
        L.set(f.lip,{x:fx,y:lipTop,w:fw,h:lipH,op:1,r:0,sc:1,z:60});
        colY[c]=lipTop+lipH+GAP;
      });
      y=Math.max(...colY);
    } else for(let r=0;r<order.length;r+=cols){
      const row=order.slice(r,r+cols), top=y+tabH, rowN=Math.max(...row.map(f=>nShown(f,S.gpeek))), lipTop=top+10+rowN*s;
      row.forEach((f,c)=>{
        const fx=16+c*(fw+cg), bills=sorted(f), n=nShown(f,S.gpeek);
        bills.forEach((b,k)=>{ const kk=Math.min(k,n-1), cy=lipTop-(n-kk)*s, vis=lipTop+14-cy;
          L.set(b.n,{x:fx+8,y:cy,w:cw,h:ch,r:0,op:k<n?1:0,cb:ch-vis,sc:1,z:2+k}); });
        const btop=lipTop-n*s-10;
        L.set(f.back,{x:fx,y:btop,w:fw,h:lipTop+lipH-btop,op:1,r:0,sc:1,z:1});
        L.set(f.lip,{x:fx,y:lipTop,w:fw,h:lipH,op:1,r:0,sc:1,z:60});
      });
      y=lipTop+lipH+GAP;
    }
  } else order.forEach(f=>{
    const top=y+tabH, bills=sorted(f);
    let lipTop;
    if(S.dir==="rows"){
      const cw=iw-24, ch=cw/1.586, n=nShown(f,S.peek), s=stripH(cw)+(S.rgap==="roomy"?9:1);
      lipTop=top+10+n*s;
      bills.forEach((b,k)=>{ const kk=Math.min(k,n-1), cy=top+10+kk*s, vis=lipTop+14-cy;
        L.set(b.n,{x:28,y:cy,w:cw,h:ch,r:0,op:k<n?1:0,cb:ch-vis,sc:1,z:2+k}); });
    } else { // fan: a hand of cards, the front one on the left, each behind it showing its amount top right
      const cw=Math.round(iw*.44), ch=cw/1.586, n=nShown(f,S.fanN), tilt=S.tilt;
      const want=S.spread==="wide"?58:S.spread==="tight"?30:44, step=n>1?Math.min(want,(iw-24-cw)/(n-1)):0;
      const spread=cw+(n-1)*step, x0=16+(iw-spread)/2, show=ch*.62, arc=m=>m*m*tilt*.9, mid=(n-1)/2;
      lipTop=top+12+show;
      bills.forEach((b,k)=>{ const kk=k<n?k:0, m=kk-mid, cy=lipTop-show+arc(m), vis=lipTop+16-cy;
        L.set(b.n,{x:x0+kk*step,y:cy,w:cw,h:ch,r:m*tilt,op:k<n?1:0,cb:ch-vis,sc:1,z:k<n?40-k:1}); });
    }
    L.set(f.back,{x:16,y:top,w:iw,h:lipTop+LIP-top,op:1,r:0,sc:1,z:1});
    L.set(f.lip,{x:16,y:lipTop,w:iw,h:LIP,op:1,r:0,sc:1,z:60});
    y=lipTop+LIP+GAP;
  });

}
let openF=null, expanded=null, busy=0;
function dockY(){ return sheet.clientHeight-$("sabProbe").offsetHeight-LIP-6; }
function openLayout(f){
  const L=new Map(), iw=IW(), cw=iw, ch=cw/1.586, s2=stripH(cw)+12, bills=sorted(f);
  let bottom=HEAD;
  bills.forEach((b,i)=>{
    const y=HEAD+(S.inside==="stack"?i*s2+(expanded!=null&&i>expanded?ch-s2+10:0):i*(ch+12));
    L.set(b.n,{x:16,y,w:cw,h:ch,r:0,op:1,cb:-40,sc:1,z:2+i}); bottom=Math.max(bottom,y+ch);
  });
  const dy=dockY()+(S.folder==="goes"?140:0), dop=S.folder==="goes"?0:1;
  L.set(f.back,{x:16,y:dy-34,w:iw,h:34+LIP,op:dop,r:0,sc:1});
  L.set(f.lip,{x:16,y:dy,w:iw,h:LIP,op:dop,r:0,sc:1});
  return {L,height:bottom+(S.folder==="goes"?40:LIP+40)};
}
function applyL(L,opt){ opt=opt||{}; let i=0;
  L.forEach((st,n)=>{ const {z,...t}=st; if(z!=null) n.el.style.zIndex=z;
    if(n.kind==="card"||n.kind==="lip") setWash(n,t.w,t.h);
    n.el.style.pointerEvents=t.op>0?"":"none";
    if(opt.instant) A.set(n,t); else A.to(n,t,{delay:(opt.stagger&&n.kind==="card")?(i++)*S.stagger:0}); });
}

/* layout everything for the current state; instant on first paint */
function relayout(instant){
  paint();
  const C=closedLayout(); closedC.style.height=C.height+"px"; $("ended").style.top=(C.height-58)+"px";
  if(!openF){ applyL(C.L,{instant}); folders.forEach(f=>A.to(f.gn,{y:0,op:1})); return; }
  // the other folders are hidden: put them where they'll be, without motion
  const others=new Map(); C.L.forEach((st,n)=>{ if(!openF.bills.some(b=>b.n===n)&&n!==openF.back&&n!==openF.lip) others.set(n,st); });
  applyL(others,{instant:true});
  const O=openLayout(openF); openC.style.height=O.height+"px"; applyL(O.L,{instant});
}

/* ---------- open a folder: its cards come out and stack in the sheet; the rest step away ---------- */
function openFolder(f){
  openF=f; expanded=null; busy++;
  const cs=closedSc.scrollTop, top=closedSc.offsetTop; openSc.scrollTop=0;
  f.bills.forEach(b=>{ openC.appendChild(b.el); A.shift(b.n,-cs); });
  fixBack.appendChild(f.back.el); A.shift(f.back,top-cs);
  fixFront.appendChild(f.lip.el); A.shift(f.lip,top-cs);
  openSc.classList.add("on"); closedSc.classList.add("off");
  $("closedHead").style.opacity=0; $("openHead").style.opacity=1; $("ended").style.opacity=0;
  paint();
  const O=openLayout(f); openC.style.height=O.height+"px"; applyL(O.L,{stagger:true});
  folders.forEach(g=>{ if(g!==f) A.to(g.gn,{y:36,op:0},{bounce:0}); });
  A.wait(.4,()=>busy--);
}
function closeFolder(){
  const f=openF; if(!f) return; busy++;
  const os=openSc.scrollTop, cs=closedSc.scrollTop, top=closedSc.offsetTop;
  // everything goes back into its folder's group straight away, in the list's coordinates, and flies home from there
  f.g.insertBefore(f.back.el,f.g.firstChild); A.shift(f.back,cs-top);
  f.g.appendChild(f.lip.el); A.shift(f.lip,cs-top);
  f.bills.forEach(b=>{ f.g.insertBefore(b.el,f.lip.el); A.shift(b.n,cs-os); });
  openF=null; expanded=null;
  openSc.classList.remove("on"); closedSc.classList.remove("off");
  $("closedHead").style.opacity=1; $("openHead").style.opacity=0; $("ended").style.opacity=1;
  paint();
  const C=closedLayout();
  const mine=new Map(); C.L.forEach((st,n)=>{ if(f.bills.some(b=>b.n===n)||n===f.back||n===f.lip) mine.set(n,st); });
  applyL(mine,{stagger:true});
  folders.forEach(g=>{ if(g!==f) A.to(g.gn,{y:0,op:1},{delay:.06}); });
  A.wait(.4,()=>busy--);
}
function cardTap(b){

  box.style.width=(402*s)+"px"; box.style.height=(874*s)+"px"; phone.style.transform=`scale(${s})`;
}
